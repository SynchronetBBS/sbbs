; Web client strings, US English.
;
; {name} marks a value the program fills in; keep each placeholder as is.
; Plurals: a key ending in _one is used instead of its base key when the
; number is exactly 1 (label_trash_notice_one beside label_trash_notice).
; Keys: button_* is a button, label_* is text, placeholder_* is hint text in
; a field.  Folder names and error codes use bare keys.

