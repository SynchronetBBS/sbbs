; Web server settings for the web mail client's directory (webmail/root).
;
; This file is part of the web mail client and is REPLACED when Synchronet
; is upgraded: do not edit it.  Who may use web mail is set with
; access_requirements in ctrl/modopts/webmail.ini.
;
; The client has its own sign-in (api.ssjs, with its session cookie), so
; the web server must not demand HTTP authentication here.  The empty
; AccessRequirements below clears any requirement inherited from a
; webctrl.ini in a directory above this one (when this directory is placed
; inside an existing web root).  The client's libraries (webmail/lib)
; are outside this directory and are never served.

AccessRequirements=

; Versioned paths: the page loads its scripts and stylesheets as
; v/<version>/js/... and v/<version>/css/... (the version is the newest
; modification time among those files), so an upgrade gives every one of
; them a new URL, the modules app.js imports included.  This rule serves
; such a path from js/ or css/ for any version, so a page loaded before an
; upgrade keeps working.  It runs only for paths with a "v" directory.
; It is written as a function so it leaves no names behind in the
; connection's script scope, which other pages on a kept-alive connection
; share.
[v/]
RewriteVersion = (function () { var s = http_request.request_string, t = s.replace(/\/v\/[0-9]{1,15}\/((?:js|css)\/)/, "/$1"); if (t !== s) http_request.request_string = t; return t !== s; })();
