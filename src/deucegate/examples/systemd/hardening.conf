# Optional hardening for the user service. Test every configured door before
# relying on this drop-in. In particular, NoNewPrivileges may prevent DOSEMU
# or another door from using a setuid executable or file capabilities.
#
# The filesystem restrictions require unprivileged user namespaces. They also
# make the user's home directory read-only except for the GameSrv root below.
# Change ReadWritePaths whenever the root or a door's writable data is elsewhere.

[Service]
NoNewPrivileges=true
PrivateUsers=true
ProtectSystem=strict
ReadOnlyPaths=%h
ReadWritePaths=%h/ib-gamesrv
PrivateTmp=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectClock=true
ProtectHostname=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
CapabilityBoundingSet=
UMask=0077
