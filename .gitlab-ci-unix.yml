# TODO: The bad touching needs to be solved in the build system, but
#       maybe there's a way to automate it with needs?
#       Build the various sbbs libraries separately as well.

spec:
  inputs:
    os:
    platform:
    tagname:
    cross_platform:
      default: 'no'
    build_flags:
      default: 'RELEASE=1'
    has_javascript:
      default: 'yes'
    has_curses:
      default: 'yes'
    has_gtk:
      default: 'no'
    gnu_make:
      default: 'gmake'
    has_valgrind:
      default: 'no'
    has_graphics:
      default: 'yes'
    build_doors:
      default: 'no'
    # The termgfx door family (libtermgfx + the doors that link it) builds with
    # CMake rather than gmake, so it needs its own gate: build_doors drives
    # `gmake` command lines that mean nothing to CMake.  These doors build on
    # Linux and on Windows (MSVC, via each door's build.bat), but the remaining
    # CI targets -- the BSDs, macOS, alpine, arm64, and the mingw-w64 GCC
    # cross-build -- are unverified, so platforms opt in as each is confirmed.
    build_termgfx_doors:
      default: 'no'
    # The remaining make(1) doors and the key generators.  Same opt-in policy
    # as build_termgfx_doors, and for the same reason: unlike the doors under
    # build_doors, these have only been confirmed to build on Linux.  Several
    # cannot build everywhere -- timeport links -lcurses (so nothing with
    # has_curses: 'no'), and sde, top and vbbs name an odoors library directory
    # by `uname`, which a cross-build does not have.
    build_more_doors:
      default: 'no'
    # qtmonitor needs a recent Qt 6 development stack.  Most of the shell
    # runners do not provide one, so platforms opt in individually.  Native
    # macOS builds use vcpkg; other opted-in Unix builds use system packages.
    build_qtmonitor:
      default: 'no'
    slow_system:
      default: 'no'
    valgrind_pre_exec:
      default: ''
---

".$[[ inputs.os ]]":
  extends: .rules
  tags:
    - "$[[ inputs.tagname ]]"

".$[[ inputs.os ]]-build":
  stage: build
  extends: .$[[ inputs.os ]]

".$[[ inputs.os ]]-test":
  stage: test
  extends: .$[[ inputs.os ]]

".$[[ inputs.os ]]-cleanup":
  stage: cleanup
  extends: .$[[ inputs.os ]]

###########
# Bundles #
###########
# These are artifact-only builds

"$[[ inputs.os ]]-$[[ inputs.platform ]] [sbbs]":
  extends:
    - .$[[ inputs.os ]]-build
  script:
    - touch ${CI_PIPELINE_ID}.ci
    - tar -xvzf "/tmp/gitlab-runner/$[[ inputs.os ]]-$[[ inputs.platform ]]-${CI_PIPELINE_ID}/sbbs-build${EXTRA_FILENAME}.tgz"
  variables:
    GIT_STRATEGY: fetch
  artifacts:
    name: "sbbs-$[[ inputs.os ]]-$[[ inputs.platform ]]"
    paths:
      - "src/sbbs3/*.exe.release/*"
      - "src/sbbs3/*.lib.release/*"
      - "src/sbbs3/*/*.exe.release/*"
  needs:
    - job: "$[[ inputs.os ]]-$[[ inputs.platform ]] [sbbs-build]"
  rules:
    - if: '"$[[ inputs.has_javascript ]]" == "no"'
      when: never
    - if: '"$[[ inputs.cross_platform ]]" == "yes"'
      when: never
    - !reference [.rules, rules]

############
# Binaries #
############
# These link a runnable binary

"$[[ inputs.os ]]-$[[ inputs.platform ]] [deucegate]":
  extends:
    - .$[[ inputs.os ]]-build
  variables:
    GIT_STRATEGY: fetch
  needs:
    - job: "$[[ inputs.os ]]-$[[ inputs.platform ]] [botan]"
  script:
    - touch ${CI_PIPELINE_ID}.ci
    - tar -xvzf "/tmp/gitlab-runner/$[[ inputs.os ]]-$[[ inputs.platform ]]-${CI_PIPELINE_ID}/botan.tgz"
    - for d in 3rdp/*.release/botan/lib/pkgconfig; do [ -d "$d" ] && export PKG_CONFIG_PATH="$(pwd)/$d${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"; done
    - |
      if [ "$[[ inputs.os ]]" = "mingw-w64" ]; then
        for d in 3rdp/*.release/botan; do
          [ -f "$d/lib/libbotan-3.a" ] && DEUCEGATE_BOTAN_ROOT="$CI_PROJECT_DIR/$d"
        done
        test -n "$DEUCEGATE_BOTAN_ROOT"
        cmake -S src/deucegate -B src/deucegate/build/ci \
          -DCMAKE_SYSTEM_NAME=Windows \
          -DCMAKE_C_COMPILER=/home/admin/mingw-w64/bin/x86_64-w64-mingw32-gcc \
          -DCMAKE_CXX_COMPILER=/home/admin/mingw-w64/bin/x86_64-w64-mingw32-g++ \
          -DCMAKE_RC_COMPILER=/home/admin/mingw-w64/bin/x86_64-w64-mingw32-windres \
          -DDEUCEGATE_BOTAN_ROOT="$DEUCEGATE_BOTAN_ROOT" \
          -DDEUCEGATE_BUILD_TESTS=OFF -DBUILD_TESTING=OFF
      else
        cmake -S src/deucegate -B src/deucegate/build/ci -DCMAKE_BUILD_TYPE=Release
      fi
    - cmake --build src/deucegate/build/ci --parallel "$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)"
    - |
      if [ "$[[ inputs.os ]]" = "mingw-w64" ]; then
        test -f src/deucegate/build/ci/deucegate.exe
      fi
      printf '%s\n' "$CI_PROJECT_DIR" > src/deucegate/build/ci/ci-project-dir
  artifacts:
    name: "deucegate-$[[ inputs.os ]]-$[[ inputs.platform ]]"
    paths:
      - "src/deucegate/build/ci/deucegate*"
      - "src/deucegate/build/ci/CTestTestfile.cmake"
      - "src/deucegate/build/ci/ci-project-dir"
  rules:
    - if: '"$[[ inputs.slow_system ]]" == "yes"'
      when: never
    - !reference [.rules, rules]

"$[[ inputs.os ]]-$[[ inputs.platform ]] [deucegate-tests]":
  extends:
    - .$[[ inputs.os ]]-test
  variables:
    GIT_STRATEGY: fetch
  needs:
    - job: "$[[ inputs.os ]]-$[[ inputs.platform ]] [deucegate]"
  script:
    - |
      deucegate_build_root=$(sed -n '1p' src/deucegate/build/ci/ci-project-dir)
      sed "s#$deucegate_build_root#$CI_PROJECT_DIR#g" \
        src/deucegate/build/ci/CTestTestfile.cmake \
        > src/deucegate/build/ci/CTestTestfile.cmake.new
      mv src/deucegate/build/ci/CTestTestfile.cmake.new \
        src/deucegate/build/ci/CTestTestfile.cmake
    - ctest --test-dir src/deucegate/build/ci --output-on-failure --no-tests=error
  rules:
    - if: '"$[[ inputs.slow_system ]]" == "yes"'
      when: never
    - if: '"$[[ inputs.cross_platform ]]" == "yes"'
      when: never
    - !reference [.rules, rules]

"$[[ inputs.os ]]-$[[ inputs.platform ]] [qtmonitor]":
  extends:
    - .$[[ inputs.os ]]-build
  variables:
    GIT_STRATEGY: fetch
    QTMONITOR_VCPKG_REF: "2026.06.01"
  needs: []
  cache:
    key: "qtmonitor-vcpkg-$CI_JOB_NAME_SLUG"
    paths:
      - .cache/vcpkg/
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - qtmonitor-vcpkg-configure.log
  script:
    - touch ${CI_PIPELINE_ID}.ci
    - |
      if [ "$(uname -s)" = "Darwin" ]; then
        export VCPKG_ROOT="$CI_PROJECT_DIR/.vcpkg"
        export VCPKG_DOWNLOADS="$CI_PROJECT_DIR/.cache/vcpkg/downloads"
        export VCPKG_DEFAULT_BINARY_CACHE="$CI_PROJECT_DIR/.cache/vcpkg/binaries"
        HOMEBREW_NO_AUTO_UPDATE=1 brew install autoconf autoconf-archive automake libtool ninja
        mkdir -p "$VCPKG_DOWNLOADS" "$VCPKG_DEFAULT_BINARY_CACHE"
        git clone --depth 1 --branch "$QTMONITOR_VCPKG_REF" https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
        "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
        cd src/sbbs3/qtmonitor
        configure_log="$CI_PROJECT_DIR/qtmonitor-vcpkg-configure.log"
        if cmake --preset macos-vcpkg -G Ninja >"$configure_log" 2>&1; then
          tail -n 80 "$configure_log"
        else
          # vcpkg appends multi-megabyte diagnostic attachments to its output.
          # Keep the complete log as an artifact, but show enough of the start
          # to include its package summary and first underlying failure.
          sed -n '1,800p' "$configure_log"
          exit 1
        fi
        cmake --build --preset macos-vcpkg
        ctest --preset macos-vcpkg
      else
        cd src/sbbs3/qtmonitor
        cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release
        cmake --build build/ci --parallel "$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)"
        ctest --test-dir build/ci --output-on-failure --no-tests=error
      fi
  rules:
    - if: '"$[[ inputs.build_qtmonitor ]]" == "no"'
      when: never
    - !reference [.rules, rules]

