    - mkdir -p "/tmp/gitlab-runner/$[[ inputs.os ]]-$[[ inputs.platform ]]-${CI_PIPELINE_ID}"
    - cd ../..
    - tar -czf "/tmp/gitlab-runner/$[[ inputs.os ]]-$[[ inputs.platform ]]-${CI_PIPELINE_ID}/cryptlib.tgz" 3rdp/*.release/cl
  variables:
    GIT_STRATEGY: fetch

# Vendored Botan.  The `botan` target in 3rdp/build is a no-op unless
# Common.gmake's probe decided USE_VENDORED_BOTAN — so this job is
# cheap on hosts that have system Botan 3.6+ or OpenSSL 3.0+ and a
# real build only happens where neither is present.  Consumers always
# extract botan.tgz; an empty archive here is fine (the extract is
# then a no-op and pkg-config resolves the system library instead).
"$[[ inputs.os ]]-$[[ inputs.platform ]] [botan]":
  extends:
    - .$[[ inputs.os ]]-build
  script:
    - touch ${CI_PIPELINE_ID}.ci
    - cd 3rdp/build
    - touch depend
    - $[[ inputs.gnu_make ]] $[[ inputs.build_flags ]] $BUILD_ARGS botan
    - mkdir -p "/tmp/gitlab-runner/$[[ inputs.os ]]-$[[ inputs.platform ]]-${CI_PIPELINE_ID}"
    - cd ../..
    # When the botan build is a no-op (system Botan/OpenSSL detected),
    # no 3rdp/*.release/botan directory exists.  Create a placeholder
    # so tar always has something to archive — BSD and busybox tar
    # don't accept `tar -T /dev/null` for zero-entry archives.
    - mkdir -p 3rdp/empty.release/botan
    - tar -czf "/tmp/gitlab-runner/$[[ inputs.os ]]-$[[ inputs.platform ]]-${CI_PIPELINE_ID}/botan.tgz" 3rdp/*.release/botan
    - rm -rf 3rdp/empty.release
  variables:
    GIT_STRATEGY: fetch

