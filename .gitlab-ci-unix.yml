# The rest of what src/doors/build.sh calls buildable: the make(1) doors that
# predate ../build/Common.gmake and drop their output straight into the source
# directory, plus the three key generators.  They are gated on
# build_more_doors rather than build_doors so a platform opts in once its
# build is confirmed, instead of turning a pipeline red to find out.
#
# None of these has a `depend`/`xpdev`/`odoors` stamp target of its own except
# where noted, so most need no touching before make -- they either link
# ../../odoors/libs-`uname` directly or compile the xpdev sources they want
# straight out of the checkout.

".$[[ inputs.os ]]-more-door":
  extends:
    - .$[[ inputs.os ]]-build
  variables:
    GIT_STRATEGY: fetch
  rules:
    - if: '"$[[ inputs.build_more_doors ]]" == "no"'
      when: never
    - !reference [.rules, rules]

# Kannons & Katapults registration key generator -- a single C file with no
# dependency on anything else in the tree, as are [oxgen] and [ytgen] below.
"$[[ inputs.os ]]-$[[ inputs.platform ]] [knkgen]":
  extends:
    - .$[[ inputs.os ]]-more-door
  script:
    - touch ${CI_PIPELINE_ID}.ci
    - cd src/doors/knkgen
    - $[[ inputs.gnu_make ]] $[[ inputs.build_flags ]] $BUILD_ARGS
  artifacts:
    name: "knkgen-$[[ inputs.os ]]-$[[ inputs.platform ]]"
    paths:
      - "src/doors/knkgen/knkgen"
  needs: []

