##################
# termgfx  doors #
##################
# libtermgfx and the doors that link it.  Unlike the ODoors-based doors above,
# these are CMake projects that build their own dependencies (xpdev, termgfx,
# and each door's vendored engine) as sub-targets, so they need no *.tgz
# artifact from the library jobs -- hence `needs: []`, letting them start
# immediately rather than waiting on the gmake library stage.
#
# Each door is driven through its own build.sh, which is the documented entry
# point and encodes the door's CMake flags (e.g. syncconquer's
# -DBUILD_VANILLATD=ON, which adds the second Tiberian Dawn binary).  Driving
# CMake directly here would silently drop those.  build.sh only builds -- it
# never deploys into a live install -- so it is safe to run unattended.
#
# libjxl and libsndfile are OPTIONAL and detected at configure time: without
# them the doors still build, but degrade (no JPEG-XL tier / music ships as raw
# PCM instead of OGG).  Their absence on a runner is therefore a silent change
# in the artifact rather than a build failure -- check the configure log's
# "termgfx: libsndfile ..." / "JPEG XL graphics tier" lines if an artifact
# behaves differently than a local build.
#
# ccache matches the [syncterm-cmake] job's convention, and matters more here:
# these trees vendor whole engines (Chocolate Duke, Vanilla Conquer).  It is set
# via the CMAKE_<LANG>_COMPILER_LAUNCHER *environment* variables rather than
# -D on the command line, because build.sh owns the cmake invocation for the
# doors and takes no extra arguments; CMake initializes the cache entry from the
# environment variable of the same name, so one setting covers every job here.

".$[[ inputs.os ]]-termgfx-door":
  extends:
    - .$[[ inputs.os ]]-build
  variables:
    GIT_STRATEGY: fetch
    CMAKE_C_COMPILER_LAUNCHER: ccache
    CMAKE_CXX_COMPILER_LAUNCHER: ccache
  needs: []
  rules:
    - if: '"$[[ inputs.build_termgfx_doors ]]" == "no"'
      when: never
    - !reference [.rules, rules]

"$[[ inputs.os ]]-$[[ inputs.platform ]] [termgfx]":
  extends:
    - .$[[ inputs.os ]]-termgfx-door
  script:
    - touch ${CI_PIPELINE_ID}.ci
    - cd src/doors/termgfx
    # TERMGFX_TESTS is OFF by default so a consuming door never builds the
    # tests; this is the one job that turns them on and runs them.
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTERMGFX_TESTS=ON
    - cmake --build build -j$(nproc 2>/dev/null || echo 4)
    # --no-tests=error: ctest's default for an empty test set is to print
    # "No tests were found!!!" and exit 0, so a job that runs nothing passes.
    # This one did exactly that, green, from the commit that added it until
    # the tests it names existed -- if TERMGFX_TESTS is ever renamed or the
    # -D stops taking effect, the guard must go red, not quiet.
    - ctest --test-dir build --output-on-failure --no-tests=error
  artifacts:
    name: "termgfx-$[[ inputs.os ]]-$[[ inputs.platform ]]"
    paths:
      - "src/doors/termgfx/build/libtermgfx.a"

"$[[ inputs.os ]]-$[[ inputs.platform ]] [syncdoom]":
  extends:
    - .$[[ inputs.os ]]-termgfx-door
  script:
    - touch ${CI_PIPELINE_ID}.ci
    - cd src/doors/syncdoom
    - ./build.sh
  artifacts:
    name: "syncdoom-$[[ inputs.os ]]-$[[ inputs.platform ]]"
    paths:
      - "src/doors/syncdoom/build/syncdoom"

"$[[ inputs.os ]]-$[[ inputs.platform ]] [syncduke]":
  extends:
    - .$[[ inputs.os ]]-termgfx-door
  script:
    - touch ${CI_PIPELINE_ID}.ci
    - cd src/doors/syncduke
    - ./build.sh
  artifacts:
    name: "syncduke-$[[ inputs.os ]]-$[[ inputs.platform ]]"
    paths:
      - "src/doors/syncduke/build/syncduke"

"$[[ inputs.os ]]-$[[ inputs.platform ]] [syncretro]":
  extends:
    - .$[[ inputs.os ]]-termgfx-door
  script:
    - touch ${CI_PIPELINE_ID}.ci
    - cd src/doors/syncretro
    - ./build.sh
    # test_audio_bytes is the only guard on the PCM streaming state machine
    # (termgfx's audio_stream.c): a 44-record golden transcript of the bytes a
    # session puts on the wire.  build.sh does not build it -- SYNCRETRO_TESTS
    # is OFF by default so a plain door build never needs libsndfile's test
    # path -- so without this the state machine's cushion could be retuned and
    # the pipeline would stay green.  Re-configuring build.sh's OWN build dir
    # keeps the CMAKE_BUILD_TYPE it set (the cache carries it) and reuses its
    # objects, so this adds the test targets and little else.  The -D must be
    # explicit: unlike CMAKE_C_COMPILER_LAUNCHER above, an option() is NOT
    # initialized from the environment.
    - cmake -S . -B build -DSYNCRETRO_TESTS=ON
    - cmake --build build -j$(nproc 2>/dev/null || echo 4)
    # See the [termgfx] job: ctest exits 0 on an empty test set, so without
    # this the guard these three lines exist to be could itself go quiet.
    - ctest --test-dir build --output-on-failure --no-tests=error
  artifacts:
    name: "syncretro-$[[ inputs.os ]]-$[[ inputs.platform ]]"
    paths:
      - "src/doors/syncretro/build/syncretro"

"$[[ inputs.os ]]-$[[ inputs.platform ]] [syncmoo1]":
  extends:
    - .$[[ inputs.os ]]-termgfx-door
  script:
    - touch ${CI_PIPELINE_ID}.ci
    - cd src/doors/syncmoo1
    - ./build.sh
  artifacts:
    name: "syncmoo1-$[[ inputs.os ]]-$[[ inputs.platform ]]"
    paths:
      - "src/doors/syncmoo1/build/syncmoo1"

# Builds BOTH titles from one tree: syncalert (Red Alert) and syncdawn
# (Tiberian Dawn).
"$[[ inputs.os ]]-$[[ inputs.platform ]] [syncconquer]":
  extends:
    - .$[[ inputs.os ]]-termgfx-door
  script:
    - touch ${CI_PIPELINE_ID}.ci
    - cd src/doors/syncconquer
    - ./build.sh
  artifacts:
    name: "syncconquer-$[[ inputs.os ]]-$[[ inputs.platform ]]"
    paths:
      - "src/doors/syncconquer/build/syncalert"
      - "src/doors/syncconquer/build/syncdawn"

# The two doors that vendor a whole interpreter rather than a small engine, so
# their build.sh is a two-stage script -- CMake for termgfx + xpdev, then the
# vendored project's own build system -- and only the first stage goes through
# the ccache launcher variables above.  Both want more wall-clock than any
# other door here: SyncSCUMM is a full ScummVM configure + make across seven
# engines, and SyncRPG builds EasyRPG Player and liblcf.
#
# Their dependencies are also the heaviest: SyncSCUMM needs ScummVM's -dev
# packages, with libmad REQUIRED (build.sh forces --enable-mad so a missing
# MP3 decoder fails here instead of shipping a talkie door with silent
# speech), and SyncRPG needs EasyRPG's (pixman, fmt, harfbuzz, icu, ...).
# Each door's COMPILING.md carries the package list.
"$[[ inputs.os ]]-$[[ inputs.platform ]] [syncrpg]":
  extends:
    - .$[[ inputs.os ]]-termgfx-door
  script:
    - touch ${CI_PIPELINE_ID}.ci
    - cd src/doors/syncrpg
    - ./build.sh
  artifacts:
    name: "syncrpg-$[[ inputs.os ]]-$[[ inputs.platform ]]"
    paths:
      - "src/doors/syncrpg/build/syncrpg"

"$[[ inputs.os ]]-$[[ inputs.platform ]] [syncscumm]":
  extends:
    - .$[[ inputs.os ]]-termgfx-door
  script:
    - touch ${CI_PIPELINE_ID}.ci
    - cd src/doors/syncscumm
    - ./build.sh
  artifacts:
    name: "syncscumm-$[[ inputs.os ]]-$[[ inputs.platform ]]"
    paths:
      - "src/doors/syncscumm/build/syncscumm"

#########
# Tests #
#########

"$[[ inputs.os ]]-$[[ inputs.platform ]] jsexec-testsuite":
  extends:
    - .$[[ inputs.os ]]-test
  script:
    - touch ${CI_PIPELINE_ID}.ci
    - echo -e "\e[0Ksection_start:`date +%s`:extract_depends[collapsed=true]\r\e[0KPreparing for build"
    - rm -rf ci-test
    - mkdir ci-test
    - cd ci-test
    - tar -xvzf "/tmp/gitlab-runner/$[[ inputs.os ]]-$[[ inputs.platform ]]-${CI_PIPELINE_ID}/sbbs-build${EXTRA_FILENAME}.tgz"
    - tar -xvzf "/tmp/gitlab-runner/$[[ inputs.os ]]-$[[ inputs.platform ]]-${CI_PIPELINE_ID}/ctrl_exec${EXTRA_FILENAME}.tgz"
    - echo -e "\e[0Ksection_end:`date +%s`:extract_depends\r\e[0K"
    - "SBBSCTRL=./ctrl src/sbbs3/*.exe.release/jsexec -U -S -f exec/tests/test.js"
    - cd ..
    - rm -rf ci-test
  variables:
    GIT_STRATEGY: none
  needs:
    - job: "$[[ inputs.os ]]-$[[ inputs.platform ]] [sbbs-build]"
      artifacts: false
  rules:
    - if: '"$[[ inputs.cross_platform ]]" == "yes"'
      when: never
    - if: '"$[[ inputs.has_javascript ]]" == "no"'
      when: never
    - !reference [.rules, rules]

"$[[ inputs.os ]]-$[[ inputs.platform ]] jsexec-testsuite-valgrind":
  extends:
    - .$[[ inputs.os ]]-test
  script:
    - touch ${CI_PIPELINE_ID}.ci
    - echo -e "\e[0Ksection_start:`date +%s`:extract_depends[collapsed=true]\r\e[0KPreparing for build"
    - rm -rf ci-test
    - mkdir ci-test
    - cd ci-test
    - tar -xvzf "/tmp/gitlab-runner/$[[ inputs.os ]]-$[[ inputs.platform ]]-${CI_PIPELINE_ID}/sbbs-build${EXTRA_FILENAME}.tgz"
    - tar -xvzf "/tmp/gitlab-runner/$[[ inputs.os ]]-$[[ inputs.platform ]]-${CI_PIPELINE_ID}/ctrl_exec${EXTRA_FILENAME}.tgz"
    - echo -e "\e[0Ksection_end:`date +%s`:extract_depends\r\e[0K"
    - "SBBSCTRL=./ctrl $[[ inputs.valgrind_pre_exec ]] valgrind --leak-check=full --error-exitcode=1 --num-callers=20 --track-origins=yes --read-var-info=yes --read-inline-info=yes --suppressions=src/sbbs3/suppressions.vg src/sbbs3/*.exe.release/jsexec -U -S -f exec/tests/test.js"
    - cd ..
    - rm -rf ci-test
  variables:
    GIT_STRATEGY: none
  needs:
    - job: "$[[ inputs.os ]]-$[[ inputs.platform ]] [sbbs-build]"
      artifacts: false
  rules:
    - if: '"$[[ inputs.cross_platform ]]" == "yes"'
      when: never
    - if: '"$[[ inputs.has_javascript ]]" == "no"'
      when: never
    - if: '"$[[ inputs.has_valgrind ]]" == "no"'
      when: never
    - !reference [.rules, rules]

