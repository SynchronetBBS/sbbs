  artifacts:
    name: "smurfcombat-$[[ inputs.os ]]-$[[ inputs.platform ]]"
    paths:
      - "src/doors/smurfcombat/*.exe.*/smurf"
      - "src/doors/smurfcombat/*.d0*"
