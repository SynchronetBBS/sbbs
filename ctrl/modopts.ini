; Contains simple JS object definitions to enable/control the optional
; behavior of various Synchronet JS modules (e.g. exec/*.js)

; Example use of this file (or its children) from a JavaScript module:
; var options = load({}, "modopts.js", "modname");

; If you find that an expected section or key is not present, add it.

!include modopts.d/*.ini

[login]
	; Send password via email to user if they forget it and can't login
	email_passwords = true
	confirm_email_address = true
	login_prompts = 10
	inactive_hangup = 30
	guest = true
	legacy_prompts = false

[newuser_prompts]
	lang = false
	backspace = true
	mouse = true
	exascii = true

[newuser]
	; Send new user welcome email (text/welcome.msg) to the new user
	send_welcome = true
	; Set ask_qnet to true to enable QWKnet Node question (sets 'Q' restriction)
	ask_qnet = false
	; If ask_qnet is true, set the QWK network name with with the qnet_name key
	qnet_name = DOVE-Net
	; Set the QWK settings for new users here
	qwk_settings = QWK_FILES|QWK_ATTACH|QWK_EMAIL|QWK_DELMAIL
	; Set ask_sysop to true to enable Synchronet Sysop question (sets FLAG 1S)
	ask_sysop = false
	; Set to false to disable the "Where did you hear about this BBS?" question
	survey = true
	; Set new user default avatar
	avatar = IH8gfyB/3H/cf9x/3H8gfyB/IH8gfyB/3n/bf9t/23/bf91/IH8gfyB/IH/ef9t/23/bf9t/3X8gfyB/IH8gf9x/23/bf9t/23/cfyB/IH8gf9t/23/bf9t/23/bf9t/238gfyB/23/bf9t/23/bf9t/23/bfyB/
	; Or set the new user default avatar from an avatar collection (.bin) file:
	avatar_file =
	avatar_offset = 0

[logon]
	; Set rlogin_xtrn_menu to true if you want your RLogin server to act as a door game server only
	rlogin_xtrn_menu = false
	; Set rlogin_auto_xtrn to true if you want your RLogin server to support direct-to-door request
	; (e.g. Web Externals)
	rlogin_auto_xtrn = true
	show_avatar = true
	draw_avatar_right = true
	draw_avatar_above = false
	set_avatar = false
	show_logon_list = true
	email_validation = false
	fast_logon = true
	fast_logon_requirements =
	eval_first =
	eval_last =

[logonlist]
	last_few_callers = 4
	last_few_callers_msg =
	last_few_callers_fmt =
	first_caller_msg =
	logons_header_fmt =
	nobody_logged_on_fmt =
	today =
	yesterday =
	backup_level = 10

[automsg]
	; max_line_len = 76
	; backup_level = 10
	; line_fmt = " > %.79s\r\n"
	; sysop_prompt = "\r\nAuto Message - ~Read, ~Write, ~Delete or ~Quit: "
	; prompt = <AutoMsg text string>
	; intro = "\r\nMaximum of 3 lines:\r\n"
	; user_fmt = "%s #%d"
	; header_fmt = <AutoMsgBy text string>
	meme = true
	; color = 0
	; border = 0
	; random = false
	; max_length = 500
	; width = 39
	; justify = 0


[xtrn_sec]
	; Set to true to disable execution of prextrn.js and postxtrn.js for external programs
	; when they are running as a logon event
	disable_pre_on_logon_event = false
	disable_post_on_logon_event = false
  
	; Enable multi-column display (when more than 10 external programs in a section)
	multicolumn = true
	; Sort the list of external programs alphabetically by name
	sort = false
	; Clear the (remote) terminal screen before executing a program
	clear_screen_on_exec = false
	; Clear the (remote) terminal screen before displaying the menu
	clear_screen = true     
	; Auto-execute the only available program when entering a program section
	autoexec = false
	; Section and program lists (arrow keys move the default item): what marks
	; the default item, and the colors (attribute letters) of its highlighted
	; name (e.g. K7 for a reverse-video bar); remove these for plain lists
	; that the navigation keys only page through when longer than the screen.
	; The marker is left out of a two-column list too wide for the screen with it.
	selected_item_prefix: "\x01U->"
	unselected_item_prefix: "  "
	selected_item_attr = V
	; Highlight the whole default item (its number too) with selected_item_attr,
	; as a bar the width of the widest item (a lightbar, without the marker)
	; highlight_line = true
	; Format of the indicator shown when a list doesn't fit on the screen
	; more_fmt: "\x01n\x01h\x01k   [%u-%u of %u]"
	; Play a sound file (in text/sound) upon entering the external programs section
	; enter_sound = doors.ogg
	; Play a music file (in text/sound) in a loop, replacing any other music playing
	; (the same music already playing is not restarted), upon entering the external
	; programs section
	; enter_music = doors_theme.ogg
	; Execute (evaluate) a JavaScript expression upon entering the external programs section
	; eval_first = bbs.menu("doortips")
	; Execute (evaluate) a JavaScript expression before/after executing any external programs (doors)
	; eval_before_exec = alert('Running ' + prog.name);
	; eval_after_exec = load('../xtrn/twitter/tweet.js', user.alias, 'ran', prog.name);

	; uncomment and modify any of the below to change the look of the main external sections menu
	; section_fmt: \1g\1h%3d: \1n\1g%s\r\n
	; section_header_fmt: \1n\1l\1gSelect \1h%s\1n\1g:\r\n\r\n:
	; section_which: \r\nWhich, ~Quit or [%u]: \1h
	; section_header_title=External Program Selection

	; uncomment and modify any of the below to change the look of the external programs menu
	; to remove titles or underline, set to the text ' '
	; multicolumn_separator: " "
	; singlecolumn_margin=7
	; header_fmt: \1n\1c\1h%s \1n\1cExternal Programs:\r\n\r\n
	; titles: \1n\1cNum \1h\xb3\1n\1c Name                             \1n\1c
	; multicolumn_fmt: \1h\1c%3u \xb3 \1n\1c%-32.32s \1h
	; singlecolumn_fmt: \1h\1c%3u \xb3 \1n\1c%s \1h
	; which: \r\n\1-\1cWhich or \1h~Q\1n\1cuit: \1h
	; underline: \1c\1h\xc4\xc4\xc4\xc4\xc5\xc4\xc4\xc4\xc4\xc4\xc4\xc4\xc4\xc4\xc4\xc4\xc4\xc4\xc4\xc4\xc4\xc4\xc4\xc4\xc4\xc4\xc4\xc4\xc4\xc4\xc4\xc4\xc4\xc4\xc4\xc4\xc4\xc4\xc4

	; to enable cost display, use these instead
	; titles: \1n\1cNum \1h\xb3\1n\1c Name                       Cost \1n\1c
	; multicolumn_fmt: \1h\1c%3u \xb3 \1n\1c%-26.26s\1h %5u
	; singlecolumn_fmt: \1h\1c%3u \xb3 \1n\1c%-26.26s\1h %5u

	; to ask for continuation after showing DOOR intro/message file, enable this
	; prompt_on_info = true
	; prompt_on_info_fmt: \r\n\x01n\x01cDo you wish to continue

[shell]
	; Upon entering the main or file section of a command shell (not upon the initial
	; display of the main menu after logon):
	; Play a sound file (in text/sound)
	; main_sound = main.ogg
	; file_sound = file.ogg
	; Play a music file (in text/sound) in a loop, replacing any other music playing
	; (the same music already playing is not restarted)
	; main_music = main_theme.ogg
	; file_music = file_theme.ogg
	; Execute (evaluate) a JavaScript expression
	; main_enter = bbs.menu("maintips")
	; file_enter = bbs.menu("filetips")
	; Message group/sub-board and file library/directory selection lists
	; (arrow keys move the default item): what marks the default item, and
	; the colors (attribute letters) of its highlighted description (e.g. K7
	; for a reverse-video bar); remove these to mark the default item with '*'
	selected_item_prefix: "\x01U->"
	unselected_item_prefix: "  "
	selected_item_attr = V
	; Format of the indicator shown when a list doesn't fit on the screen
	; more_fmt: "\x01n\x01h\x01k   [%u-%u of %u]"

[text_sec]
	; Text file section and file lists (arrow keys move the default item):
	; what marks the default item, and the colors (attribute letters) of its
	; highlighted name (e.g. K7 for a reverse-video bar); remove these for a
	; plain list that the arrow keys only scroll when it is longer than the screen
	selected_item_prefix: "\x01U->"
	unselected_item_prefix: "  "
	selected_item_attr = V
	; Format of the indicator shown when a list doesn't fit on the screen
	; more_fmt: "\x01n\x01h\x01k   [%u-%u of %u]"

[scancfg]
	; Message scan and new-scan pointer configuration lists (arrow keys move
	; the default item): what marks the default item, and the colors
	; (attribute letters) of its highlighted name (e.g. K7 for a reverse-video
	; bar); remove these for a plain list that the arrow keys only scroll
	; when it is longer than the screen
	selected_item_prefix: "\x01U->"
	unselected_item_prefix: "  "
	selected_item_attr = V
	; Highlight the whole item (its number and state too)
	; highlight_line = true
	; Format of the indicator shown when a list doesn't fit on the screen
	; more_fmt: "\x01n\x01h\x01k   [%u-%u of %u]"

[uselect]
	; Item selection lists (e.g. command shell or editor choice), when
	; "uselect" is the Select Item loadable module (SCFG->System->Loadable
	; Modules); a [uselect:<title>] section applies to only that list
	; Arguments: padding, item number, item name
	selected_item_fmt: "\x01U->\x01v%*s(\x01V%d\x01v) \x01V%s \x01U<-"
	unselected_item_fmt: "\x01U  \x01v%*s(\x01V%d\x01v) \x01U%s"
	; For a reverse-video bar instead, use this selected_item_fmt:
	; selected_item_fmt: "\x01U->\x01v%*s(\x01V%d\x01v) \x01n\x017\x01k%s\x01n \x01U<-"

[listfiles]
	; File listings, when "listfiles" is the List Files loadable module
	; (SCFG->System->Loadable Modules). The defaults look like the built-in
	; file lister. A [listfiles:lib<N>] section (N = library number) applies
	; to only that library and a [listfiles:<code>] section to only the
	; directory with that internal code.
	;
	; Directory headers: data/dirs/<code>.hdr, else the first of these menu
	; files (in text/menu) that exists: listfiles_<code>_head,
	; listfiles_lib<N>_head, listfiles_head; else a box with the library,
	; directory and number of files. A footer may follow the last file:
	; listfiles_<code>_tail, listfiles_lib<N>_tail, listfiles_tail.
	;
	; One file's line: @-codes, including the @FILE_*@ codes, with the usual
	; width and alignment modifiers (e.g. @FILE_DATE-R10@), plus these:
	;   @NAME@ filename (12 columns), @DESC@ description, @SIZE@ size or FREE,
	;   @FLAGS@ extended description marker, @MISSING@ missing file marker,
	;   @LETTER@ batch flag letter, @TAG@ tagged/untagged marker, and the
	;   colors @NAME_ATTR@, @FLAGS_ATTR@, @LETTER_ATTR@, @TAG_ATTR@, @SIZE_ATTR@
	;   and @DESC_ATTR@
	; for users with batch flagging enabled:
	; line_fmt: "@NAME_ATTR@@NAME@@FLAGS_ATTR@@FLAGS@@LETTER_ATTR@@LETTER@@SIZE_ATTR@@SIZE-R6@@MISSING@@DESC_ATTR@@DESC@"
	; for users with batch flagging enabled, on terminals with cursor
	; positioning (arrow keys move the current file, Space tags files):
	; line_fmt_interactive: "@NAME_ATTR@@NAME@@FLAGS_ATTR@@FLAGS@@TAG_ATTR@@TAG@@SIZE_ATTR@@SIZE-R6@@MISSING@@DESC_ATTR@@DESC@"
	; for users with batch flagging disabled:
	; line_fmt_nobatch: "@NAME_ATTR@@NAME@@FLAGS_ATTR@@FLAGS@@SIZE_ATTR@@SIZE-R7@@MISSING@@DESC_ATTR@@DESC@"
	; The command keys shown above the files in the interactive mode, below
	; any header (set to "" to show them in a custom header instead)
	; interactive_commands: "\x01n\x01>\x01q\x014 \x01h\x01y[\x01w\x01~D\x01y]ownload  [\x01w\x01~B\x01y]atch  [\x01wSpace\x01y] Tag  [\x01w\x01~V\x01y]iew  [\x01w\x01~E\x01y]xt Info  [\x01w\x01~T\x01y]oggle Desc  [\x01w\x01~Q\x01y]uit\x01>\x01n\r\n"
	; The interactive mode's prompt. Arguments: more_above or no_more,
	; more_below or no_more, library number, library name, directory number,
	; directory name, number of files
	; interactive_prompt: "\x01n\x01c%s \x01hListing \x01n\x01c%s (\x01h%u\x01n\x01c) %s (\x01h%u\x01n\x01c) %s (\x01h\x01`?\x01n\x01c=Menu) (\x01h%u\x01n\x01c Files): \x01n\x01~"
	; Right-justified on the line above the interactive mode's prompt ("" for
	; none). Arguments: current file number, number of files
	; position_fmt: "\x01n\x01h\x01k[file %u of %u]"
	; Whether there are more pages of files before and after this one, on
	; either side of the prompt's verb
	; more_above: "\x18"
	; more_below: "\x19"
	; no_more: "\xfe"
	; extdesc_marker: "+"
	; missing_marker: "-"
	; tagged_marker: "\xfb"
	; In the interactive styles, a file in the batch download queue
	; queued_marker: "\x19"
	; untagged_marker: " "
	; Colors, as attribute letters (as in attr.ini, e.g. WH4: bright white on
	; blue), when not the attr.ini file listing colors:
	; name_attr = BH
	; size_attr = M
	; desc_attr = W
	; letter_attr = B
	; tag_attr = WH
	; flags_attr = KH
	; free_attr = MHI
	; What a search found, in the descriptions (by default, the color it's
	; in, brightened, or dimmed when already bright; on the Extended File
	; Info module's screen, bright yellow)
	; found_attr = YH
	; hdr_box_attr = YH
	; hdr_line_attr = B
	; Header box characters and the short header's underline character
	; box_top_left: "\xc9"
	; box_top_right: "\xbb"
	; box_bottom_left: "\xc8"
	; box_bottom_right: "\xbc"
	; box_horizontal: "\xcd"
	; box_vertical: "\xba"
	; short_hdr_underline: "\xc4"
	; The current file, in the classic style: highlight the whole line
	; (highlight_line = true) or only its name, in these colors
	; selected_item_attr = V
	; highlight_line = true
	;
	; The interactive listing's style: classic (the above, like the built-in
	; file lister) or lightbar (like msglist: the library and directory on
	; the top row, key tips on the bottom row, a full-width bar on the
	; current file and a preview pane of its information, shown with the
	; extended descriptions setting). Header and footer
	; files aren't shown in the lightbar style.
	; style = classic
	; The lightbar style's file line, top row (arguments: library name,
	; directory's long name), current file's position (on 80+ column
	; screens; arguments: file number, number of files) and column headings:
	; true to generate them from the file line (with the heading_* titles, in
	; lightbar_headings_attr), your own text, or false for none. The top
	; row's and headings' last color fills the rest of their rows.
	; line_fmt_lightbar: "@NAME_ATTR@@NAME@@FLAGS_ATTR@@FLAGS@@TAG_ATTR@@TAG@@SIZE_ATTR@@SIZE-R6@@MISSING@@DESC_ATTR@@DESC@"
	; lightbar_area_fmt: "\x01n\x01k\x017 %s / %s\x01h"
	; lightbar_position_fmt: "[file %u of %u]"
	; lightbar_headings = true
	; lightbar_headings_attr = KH7
	; heading_name = Name
	; heading_size = Size
	; heading_desc = Description
	; The key tips on the bottom row (mnemonics: ~ before each key letter),
	; and for users who may remove files from the directory
	; lightbar_keys_prefix: "\x01n\x01c\xfe "
	; lightbar_keys: "~Download, ~Batch, ~View, ~Extended, ~Info, Space=Tag, ~Quit or ~?"
	; lightbar_keys_operator: "~Download, ~Batch, ~View, ~Extended, ~Info, ~Remove, ~Move, Space=Tag, ~Quit or ~?"
	; The bar's color
	; lightbar_attr = WH4
	; The key tips row's colors (filling the row; empty, the default, for
	; attr.ini's mnemonic colors) and its key letters' colors, e.g. black on
	; cyan with bright white keys:
	; lightbar_keys_attr = K6
	; lightbar_key_attr = WH6
	; The preview pane's full filename, shown first when the list cuts the
	; name short (unless it's the description, as for files without one)
	; preview_name_fmt: "\x01n\x01cName \x01h@FILE_NAME@\x01n\r\n"
	; The preview pane's file information (@FILE_*@ codes; the extended
	; description follows)
	; preview_info_fmt: "\x01n\x01cSize \x01h@FILE_BYTES-T@\x01n\x01c bytes, uploaded \x01h@FILE_DATE_ULED@\x01n\x01c by \x01h@FILE_UPLOADER@\r\n\x01n\x01cDownloaded \x01h@FILE_TIMES_DLED-T@\x01n\x01c times, last on \x01h@FILE_DATE_DLED@\x01n\x01c, cost \x01h@FILE_COST@\x01n\r\n"
	; The pane's separator line: fill character, label, line range (first,
	; last, total) and colors without and with the focus
	; preview_separator: "\xc4"
	; preview_info_label: "\xb4 Info \xc3"
	; preview_lines_fmt: "\xb4 Lines %u-%u of %u \xc3"
	; The extended description's color (before any of its own color codes)
	; preview_extdesc_attr = WH
	; preview_attr = C
	; preview_focus_attr = WH

[chat_sec]
	finger = true
	imsg = true
	irc = true
	irc_seclevel = 90
	; Over-ride default IRC server/port and channels (if desired), comma-separated lists here:
	irc_server = irc.synchro.net 6667
	irc_channel = #Synchronet
	; Can also specify list per server, e.g.
	; irc.synchro.net = #synchronet, #bbs

[jsonchat]
	;see exec/load/json-server.js for help setting up a chat server
	host = bbs.thebrokenbubble.com
	;default host: bbs.thebrokenbubble.com
	port = 10088
	;default port: 10088

[fingerservice]
    bbslist = false
    findfile = false
    include_age = false
    include_gender = false
    include_location = true
    include_real_name = true

[webfinger]
    ; Optional HTTPS links to existing public resources.
    ; profile_url = https://bbs.example/users/{alias}
    ; plan_url = https://bbs.example/plans/{number4}.txt

[nodelist]
    include_age = false
    include_gender = false
    include_web_users = true
    web_inactivity_timeout = 900
    web_browsing = browsing

	; advanced nodelist customizations:
    ;format: \1n\1h%3d  \1n\1g%s
    ;username_prefix: \1h
    ;status_prefix: \1n\1g
    ;age_prefix:
    ;gender_prefix:
    ;connection_prefix:
    ;errors_prefix: \1h\1r
    ;gender_separator = " "

[sbbslist]
	export_freq = 7
	add_ars = not guest

[avatars]
	export_freq = 7
	; Age (in days) of the oldest messages imported by the first import, 0 = all
	first_import_days = 30

[dyndns]
	password =
	mx =
	ip =
	ip6 =
	txt =
	loc =
	wildcard =

; echicken's web interface v4
[web]
    guest=Guest
    timeout=43200
    inactivity=900
    user_registration=false
    maximum_telegram_length=800
    web_directory=../webv4
    ftelnet=true
    ftelnet_splash=../text/synch.ans
    keyboard_navigation=false
    vote_functions=true
    refresh_interval=60000
    xtrn_blacklist=scfg,oneliner
    layout_sidebar_off=false
    layout_sidebar_left=false
    layout_full_width=false
    forum_extended_ascii=false
    max_messages=0
    nodelist_ibbs = true
    darkmode_off=false

[fseditor]
    ; disable will remove the CTRL-D and CTRL-O options
    ; spell_enabled = true
    ; en-US, en-GB, en-AU, and en-CA are supported
    ; default_spell_language = en-US
    ; Offer to spell check before sending a message
    ; default_spell_before_send = false
    ; Highlight spelling errors are the user types
    ; default_spell_inline = false
    ; Skip quoted text when spellchecking
    ; default_spell_skip_quotes = true
    ; Skip spell checking words that are all uppercase
    ; default_spell_skip_caps = true

