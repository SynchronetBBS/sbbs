; Options for the web mail client (webmail)
;
; Every option is shown here commented out with its default value, so this
; file as shipped changes nothing.  Remove the leading semicolon from a line
; and edit the value to change an option.
;
; While this file exists, a [webmail] section in modopts.ini is not read.

; Where the web mail client's files are.  A relative path is relative to the
; exec directory.  The default is the "webmail" directory beside the "exec"
; directory.
;directory = ../webmail/

; Seconds a signed-in session may sit idle before the user must sign in again
; (does not apply to "keep me signed in" sessions).  Minimum 60.  Such a
; session also ends 24 hours after sign-in, however it is used.
;session_timeout = 7200

; Days a "keep me signed in" session lasts.  Minimum 1.
;remember_days = 30

; Seconds between the browser's checks for new mail.  Minimum 15.  When not
; set: half the web server's MaxInactivity, at least 15 and at most 60 (60
; at the default MaxInactivity of 2 minutes and above), or 60 if the web
; server does not report it, so an open page's check does not arrive just
; as the server closes the idle connection.  A sysop who lowers
; MaxInactivity thus also makes open pages check more often; setting
; poll_interval here fixes the interval regardless.
;poll_interval = 60

; Largest total size, in bytes, of the attachments on one message.  When
; not set: the most that fits in max_message_bytes, since files grow by
; about a third when sent (15323844 at the default max_message_bytes), or
; 26214400 when max_message_bytes is 0.
;max_attachment_bytes = 15323844

; Largest text part of a message, in bytes, that is shown in full.
;max_text_part_bytes = 1048576

; Most drafts a user may keep.
;max_drafts = 50

; Most bytes a user's drafts may take on disk: their attachments and their
; text (each draft's subject, recipients and body) together.
;max_draft_bytes = 104857600

; Largest text, in bytes, of a message being written (a draft's body).
; At most 2035455 (what one request to the web server can carry).
;max_body_bytes = 1048576

; Most recipients (To, CC and BCC together) of one message being sent.
; 0: no limit.
;max_recipients = 50

; Largest message, in bytes, that may be sent: its text and its attachments
; as they are stored and sent (attachments take about a third more space
; encoded than as files).  The default is the mail server's own default
; largest message (MaxMsgSize in the [Mail] section of sbbs.ini).  0: no
; limit (attachments are then limited by max_attachment_bytes alone).
;max_message_bytes = 20971520

; Access requirement string a user must meet to use web mail.  Empty lets in
; every user except guests.
;access_requirements =

; Set to true to sign a user in here without the sign-in form when they are
; already signed in to the webv4 web interface.  This works only when web
; mail is served on the same host name as webv4, and it makes a user's mail
; only as well protected as their webv4 session.
;webv4_login = false

; Set to false to allow plain (unencrypted) HTTP.  When true, web mail
; refuses to run over anything but HTTPS.
;require_tls = true

; Name of the request header by which a reverse proxy you trust tells the web
; server a request arrived over HTTPS (for example X-Forwarded-Proto).  Empty
; trusts no proxy.
;tls_proxy_header =

; Seconds browsers are told to insist on HTTPS for this site
; (Strict-Transport-Security).  0 sends no such header.
;hsts_max_age = 0

; Default language for users who have not chosen one.
;locale = en_us

; Name shown in the page title and header.  {system} is replaced by the
; BBS name and {host} by the host name the browser asked for (for a system
; that serves mail for several domains, "{host} Webmail" names each one);
; any other text is shown as written.
;product_name = {system} Webmail

; HTML shown in the page header in place of the product name.  Empty shows
; the product name.  Being HTML, a "<" or "&" meant as text must be written
; as &lt; or &amp;.
;brand =

; HTML shown under the sign-in form.  Being HTML, a "<" or "&" meant as text
; must be written as &lt; or &amp;.
;login_text =

; HTML for links shown in the page footer (under the sign-in form).  Being
; HTML, a "<" or "&" meant as text must be written as &lt; or &amp;.
;footer_links =

; Address of a page that the message for unsupported browsers links to (for
; example a simpler mail page): an http:// or https:// address, or a path
; relative to the web mail page.  Empty shows no link.
;fallback_url =
