; This file is used by the Synchronet Mail Server for blocking SPAM hosts.
; If the mail server receives an SMTP connection from a host with an IP
; address or hostname listed in this file, the session will be refused
; with an SMTP 550 error.

; E-mail addresses of spammers (or SPAM recipients) do NOT go in this file
; (use ctrl/spambait.cfg, ctrl/twitlist.cfg, or text/email.can instead).

; Each spam host IP address or hostname must be on its own line.
; Synchronet .can-style wildcards (e.g. "*.mail.domain" or "192.0.2.*") and
; IPv4/IPv6 CIDR notation (e.g. "192.0.2.0/24") are allowed.

; Blank lines and lines beginning with semicolons are ignored.

; NOTE: Hostname look-ups must be enabled in the Mail Server for hostname
;       blocking to work.

; Hosts listed in ctrl/spamblock_exempt.cfg are never blocked by this file.

; If the mail server receives any mail for e-mail addresses listed in the
; ctrl/spambait.cfg file, it will automatically append the sending host's
; IP address to this file, followed by TAB-separated metadata fields:
; when it was added (t=), the protocol (p=), the reason (r=), when the
; entry expires (e=, if a "SpamBlockDuration" is configured in the [Mail]
; section of sbbs.ini), the sender's address (u=) and hostname (h=). Example:

; 192.0.2.1	t=20261103T143613-0800	p=SMTP	r=SPAM BAIT (spam@yourbbs.com) taken	e=20270502T153614-0800	u=<spammer@some.domain>	h=mail.some.domain

; Expired entries no longer block, but remain in this file until removed by
; the "trashman" utility (e.g. run as a monthly timed event).

; If you receive a lot of mail for spambait e-mail addresses, this file
; could get quite large over time and may need maintenance.

; If your mail server is refusing mail from trusted senders, the contents
; of this file could be the cause (use with caution).

; A sorted list of blocked SPAM host IP addresses in use on Vertrauen can
; be downloaded from ftp://vert.synchro.net/Synchronet/spamblock.cfg
; (again, use with caution).
