; Web request path aliasing
;
; request path = request path
;
; for example (if FileVPathPrefix is set to /files/):
;
; /Synchronet/ = /files/main/sbbs/
; /Dresden/ = /files/music/dresden/
; /Weedpuller/ = /files/music/wp/
;
; Request path aliases belong here, in the root section, ABOVE the [dir]
; line: every line below it is read as a directory alias.

[dir]
; request path = real directory (relative to ctrl, or absolute)
;
; A directory served here runs server-side scripts (.ssjs, .xjs and CGI)
; exactly as the web root does, so never point one at a directory that
; users can upload into.
;
; The site root's webctrl.ini does not apply to an aliased directory:
; give the directory a webctrl.ini of its own.
;
;/webmail/ = ../webmail/root/
