; Web Server request blocking by request header
;
; A request is refused with "403 Forbidden" when one of its headers matches
; a pattern in the [header:<name>] section for that header.  Header names
; are not case-sensitive.  Changes take effect without recycling the server.
;
; In each section:
;   Keys that are numbers hold the patterns, tried in key order (gaps in
;   the numbering are fine).  The pattern syntax is that of the *.can and
;   *.cfg filter files, not case-sensitive:
;     text      the whole value is text
;     text~     the value contains text
;     text^     the value begins with text
;     te*xt     the value begins with te and ends with xt
;     !pattern  exception: a value that matches is not blocked
;   A section of only ! patterns blocks every value matching none of them.
;   A header the request does not send matches no pattern, so only a
;   section that ends in a ! pattern (an allowlist) blocks its absence.
;
;   FilterThreshold = <n>   after n requests from one client blocked by
;                           this header, add it to ip.can (0 = never, the
;                           default).  Clients are counted by IP address, or
;                           by subnet per [Web] RateLimitSubnetPrefix4/6 and
;                           RateLimitFilterSubnetThreshold in sbbs.ini
;   FilterDuration = <time> how long that ip.can entry lasts (default: [Web]
;                           RateLimitFilterDuration in sbbs.ini)
;   FilterSilent = <bool>   use ip-silent.can instead (default: [Web]
;                           RateLimitFilterSilent in sbbs.ini)
;
; [header:host] is checked against the host name the server uses for the
; request (no :port, and from the request line when the request names one),
; or the server's own host name when the request has no Host header.
;
; Only the first section for a header is used.
;
; Clients listed in ipfilter_exempt.cfg are never blocked.
;
; Examples:
;
; [header:user-agent]
; 0 = lightpanda~
; 1 = bytespider~
; 2 = python-requests^
; FilterThreshold = 3
;
; [header:referer]
; 0 = semalt.com~
;
; [header:host]
; 0 = !www.example.com
; 1 = !example.com
