Name: Gooble Gooble
Desc: A Pac-Man knock-off for Synchronet BBS
By:   echicken -at- bbs.electronicchicken.com
Cats: Games
Subs: Classic, Clone, JavaScript
Inst: 2020/09/07

[prog:GOOBLE]
cmd  = ?gooble.js
settings = XTRN_MULTIUSER
required = true

; Seed a sysop-owned (git-ignored) server.local.ini from the distributed
; server.ini; the door prefers it via file_cfgname().  Without this [copy:],
; [ini:server.local.ini] would fall back to writing ctrl/server.local.ini.
[copy:server.ini]
dest = server.local.ini

[ini:server.local.ini]
prompt = Share data with electronic chicken bbs
keys = host
values = 'bbs.electronicchicken.com'

!include install-json-service.ini

[ini:json-service.ini:gooble2]
keys=dir
values=startup_dir