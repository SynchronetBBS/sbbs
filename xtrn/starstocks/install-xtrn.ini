Name: Star Stocks
Desc: A game of galactic investment
By: mcmlxxix (Matt Johnson)
Cats: Games
Subs: Stocks, Multiplayer, JavaScript
Inst: 2020/09/14

[prog:STARSTOX]
cmd  = ?stars.js
settings = XTRN_MULTIUSER
required = true

; Seed a sysop-owned (git-ignored) server.local.ini from the distributed
; server.ini; the door prefers it via file_cfgname().  Without this [copy:],
; [ini:server.local.ini] would fall back to writing ctrl/server.local.ini.
[copy:server.ini]
dest = server.local.ini

[ini:server.local.ini]
prompt = Share data with The BRoKEN BUBBLe BBS
keys = host
values = 'bbs.thebrokenbubble.com'

!include install-json-service.ini

[ini:json-service.ini:starstocks]
keys=dir
values=startup_dir
