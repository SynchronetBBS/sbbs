Name: Synchronet Oneliners
Desc: Inter-BBS Oneliners for Synchronet BBS
By:   echicken
Cats: Main, Communications, Messaging
Subs: Wall, InterBBS, JavaScript
Inst: 2020/10/04

[prog:ONELINER]
cmd  = ?oneliners.js
settings = XTRN_MULTIUSER
required = true

; Seed a sysop-owned (git-ignored) settings.local.ini from the distributed
; settings.ini; the door prefers it via file_cfgname().  Without this [copy:],
; [ini:settings.local.ini] would fall back to writing ctrl/settings.local.ini.
[copy:settings.ini]
dest = settings.local.ini

[ini:settings.local.ini]
prompt = Share data with electronic chicken bbs
keys = server
values = 'bbs.electronicchicken.com'

!include install-json-service.ini

[ini:json-service.ini:oneliners]
keys = dir
values = startup_dir
