; SixelView Library theme file
;
; Selected with theme= in settings.ini (relative to the sixelview directory).
;
; Colors use the same codes as Synchronet Ctrl-A attributes, written without
; the Ctrl-A characters (as in the DDMsgReader themes):
;   n normal   h high intensity   i blink
;   Foreground: k black r red g green y yellow b blue m magenta c cyan w white
;   Background: 0 black 1 red 2 green 3 brown 4 blue 5 magenta 6 cyan 7 white
; Text settings may contain \x01 followed by an attribute character.

; -------- Header --------

; Title line text and the library/directory name shown in it
headerTextColor=n7r
headerNameColor=b
; Column headings
colHeaderColor=nhw

; -------- File and library list --------

listNumColor=nhy
listNameColor=nc
listDescColor=nc
listSizeColor=nc
listDateColor=hb
; Sub-directory entries
listDirColor=nhy

; Highlighted (selected) row for the lightbar
listHighlightBkgColor=4
listNumHighlightColor=hy
listNameHighlightColor=hc
listDescHighlightColor=hc
listSizeHighlightColor=hw
listDateHighlightColor=hw
listDirHighlightColor=hy

; -------- Text reader --------

; Color of the text when reading a plain text file
textBodyColor=nw

; -------- Help line at the bottom of the screen --------

; Background
helpLineBkgColor=7
; General text
helpLineGeneralColor=b
; Hotkeys
helpLineHotkeyColor=r
; The ) separating the hotkeys from the general text
helpLineParenColor=m

; -------- Scrollbar --------

scrollbarBGColor=nhk
scrollbarBGChar=\xb0
scrollbarScrollBlockColor=nhw
scrollbarScrollBlockChar=\xdb

; -------- Text --------

titleText=\x01n\x01h\x01wSixelView Library
noLibrariesText=\x01n\x01h\x01yThere are no libraries available.
emptyLibraryText=\x01n\x01h\x01yThere are no files to display here.
errorText=\x01n\x01h\x01rUnable to display file: \x01w%s
loadingText=\x01n\x01h\x01cLoading...
hookErrorText=\x01n\x01h\x01rUnable to get the list from the server.
