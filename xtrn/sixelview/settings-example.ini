; settings-example.ini - SixelView Library configuration
;
; Copy this file to settings.ini in the sixelview directory and edit it.
; Lines starting with ; are comments.

; Theme file holding the colours and text (relative to the sixelview directory,
; or an absolute path).
theme=DefaultTheme.cfg

; Text/ANSI file viewing.  Users can change these while browsing with the S (speed)
; and P (pause) keys.
;   pause        true = pause after each screen of a text/ANSI file (default false)
;   speed        output speed: 300 600 1200 2400 4800 9600 19200 38400 57600 76800
;                115200; omit for full speed.  The speed is paced by the BBS (not by
;                SyncTERM) so that Ctrl-C, Esc or Q can always stop the display.
;                With pause on, ANSI art stops after every screen with a -- More --
;                prompt.
;   zip_max_mb / zip_max_files   largest archive (uncompressed size, file count)
;                that will be extracted.  Defaults 50 and 1000.
;   image_max_mb  largest PNG rendering (online archives) that will be shown.  Default 3.
;   cache_max_days / cache_max_mb   downloaded files from online archives (.cache/) are
;                deleted when older than this many days (default 14) or, oldest first,
;                when the cache grows beyond this many MB (default 100).  0 = no limit.
;pause=false
;speed=2400
;zip_max_mb=50
;zip_max_files=1000
;image_max_mb=3
;cache_max_days=14
;cache_max_mb=100

; Each [library:<name>] section defines one directory of PDF/image files.
; Libraries are listed in the order they appear in this file.
;
;   dir      Directory holding the files (absolute, or relative to the sixelview
;            directory).  Required.
;   desc     Description shown beside the library name.
;   ars      Synchronet ARS string; only users who satisfy it can see and enter
;            the library.  Blank or missing = everyone.
;   include  Comma-separated wildcard patterns (* and ?, not case-sensitive).  ONLY
;            files matching one of them are listed.  Blank = every supported type.
;   exclude  Comma-separated wildcard patterns.  Matching files are hidden; every
;            other supported type is listed.  If both are given, include is applied
;            first and exclude is then removed from that.  (hide= is accepted as
;            another name for exclude=, for people coming from ansiview.)
;            Examples:  *.exe,*.com,*.html,*.rip,*.jpg,*.gif,*.___,*.rar
;            A bare extension (pdf or .pdf) is treated as *.pdf.
;   subdirs  true = also list sub-directories so users can browse into them (they
;            can never leave the library directory).  Default false.
;   sort     name, date or size; prefix with - to reverse.  Default name.
;
;   module   Instead of dir, the name of a hook in the hooks directory that supplies
;            the listing from an online archive (e.g. sixteencolors.js).  ars,
;            include, exclude and desc work as usual; subdirs and sort do not apply.
;   cachettl With module: seconds to keep downloaded listings (default 86400).
;            Downloaded files are kept in .cache/<module>/ in the sixelview directory.
;
; Hooks are JavaScript files in the hooks directory; hooks/sixteencolors.js
; documents the (small) interface for writing your own.
;
; Only the supported file types below are ever listed, whatever the patterns say:
;   pdf png jpg jpeg gif bmp ppm pgm six       (shown in the Sixel viewer)
;   ans ansi asc txt msg diz nfo bbs           (text and ANSI/ASCII art)
;   zip                                        (extracted on demand; needs subdirs=true)
;
; A ZIP file is extracted the first time a user selects it, into a directory of
; the same name beside it, and the user is taken into that directory.  The ZIP is
; then hidden from the list.  The sixelview user must be able to write to the
; library directory for this to work.
