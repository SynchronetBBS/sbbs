; settings-example.ini - SixelView Library configuration
;
; Copy this file to settings.ini in the sixelview directory and edit it.
; Lines starting with ; are comments.

; Theme file holding the colors and text (relative to the sixelview directory,
; or an absolute path).
theme=DefaultTheme.cfg

; Text/ANSI file viewing.  Users can change these while browsing with the S (speed)
; and P (pause) keys.
;   pause        true = pause after each screen of a text/ANSI file (default false)
;   speed        output speed: 300 600 1200 2400 4800 9600 19200 38400 57600 76800
;                115200; omit for full speed.  The speed is paced by the BBS (not by
;                SyncTERM) so that Ctrl-C, Esc or Q can always stop the display.
;                With pause on, ANSI art stops after every screen with a -- More --
;                prompt.
;   zip_max_mb / zip_max_files   largest archive (uncompressed size, file count)
;                that will be extracted.  Defaults 50 and 2000.
;   error_mail   who gets a netmail when an archive can't be opened because it is over
;                those limits: a user's alias or number, or an Internet address.
;                Blank = the sysop; none = nobody.
;   image_max_mb  largest PNG rendering (online archives) that will be shown.  Default 3.
;   cache_max_days / cache_max_mb   downloaded files from online archives (.cache/) are
;                deleted when older than this many days (default 14) or, oldest first,
;                when the cache grows beyond this many MB (default 100).  0 = no limit.
;   text_types  extra file extensions to show as plain text (a file with an unknown extension
;                is shown as text anyway unless it looks like a binary file), e.g.
;                text_types=conf,sh,readme
;pause=false
;speed=2400
;zip_max_mb=50
;zip_max_files=2000
;error_mail=
;text_types=
;image_max_mb=3
;cache_max_days=14
;cache_max_mb=100

; Each [library:<name>] section defines one directory of PDF/image files.
; Libraries are listed in the order they appear in this file.
;
;   dir      Directory holding the files (absolute, or relative to the sixelview
;            directory).  Required.
;   desc     Description shown beside the library name.
;   ars      Synchronet ARS string; only users who satisfy it can see and enter
;            the library.  Blank or missing = everyone.
;   include  Comma-separated wildcard patterns (* and ?, not case-sensitive).  ONLY
;            files matching one of them are listed.  Blank = every supported type.
;   exclude  Comma-separated wildcard patterns.  Matching files are hidden; every
;            other supported type is listed.  If both are given, include is applied
;            first and exclude is then removed from that.  (hide= is accepted as
;            another name for exclude=, for people coming from ansiview.)
;            Examples:  *.exe,*.com,*.html,*.rip,*.jpg,*.gif,*.___,*.rar
;            A bare extension (pdf or .pdf) is treated as *.pdf.
;            File names are raw bytes, so DOS-era names with line-drawing characters can be
;            matched by typing the characters (UTF-8, e.g. *.───) or as \xHH (*.\xC4\xC4\xC4).
;   subdirs  true = also list sub-directories so users can browse into them (they
;            can never leave the library directory).  Default false.
;   sort     name, date or size; prefix with - to reverse.  Default name.
;
;   module   Instead of dir, the name of a hook in the hooks directory that supplies
;            the listing from an online archive (e.g. sixteencolors.js).  ars,
;            include, exclude and desc work as usual; subdirs and sort do not apply.
;   url      A web site, instead of dir or module: the page shown when the library is
;            opened (a "mini browser", see the readme).
;   allow    With url: comma-separated host names (wildcards allowed) that pages,
;            pictures and links may come from.  Default: the host of url.  Links to any
;            other host are not clickable, and pictures from other hosts aren't loaded.
;   images   With url: false = don't load pictures.  Default true.
;   content  With url: the ids of the page elements to show (comma separated), leaving out menus, side
;            bars and the like; if none of them is on a page, the whole page is shown.  For
;            Wikipedia: content=searchform,firstHeading,mw-content-text (searchform is the search box at the top;
;            it needs forms=true)
;   forms    With url: true = forms on the pages (search boxes and so on) can be filled in
;            and sent, with GET or POST, to hosts in allow only.  Default false.
;   max_page_kb / max_image_kb   With url: the largest page (default 1024) and
;            picture (default 3072) that will be downloaded.
;   cachettl With module: seconds to keep downloaded listings (default 86400).
;            With url: seconds to keep a downloaded page (default 600).
;            Downloaded files are kept in .cache/<module>/ in the sixelview directory.
;
;   Descriptions: a hidden file named .desc in a library directory holds one
;            "name<Tab>description" line per file or sub-directory.  The list shows them
;            beside the names; Left/Right arrows scroll long names and descriptions
;            sideways while the size and date stay put.  See the readme.
;
; Hooks are JavaScript files in the hooks directory; hooks/sixteencolors.js
; documents the (small) interface for writing your own.
;
; Files with any other extension (or none, e.g. recipe.012) are shown as plain text, so use
; exclude= to hide the ones you don't want listed.  The known types are:
;   pdf png jpg jpeg gif bmp ppm pgm six svg   (shown in the Sixel viewer)
;   html htm xhtml epub                        (laid out as pages and shown in the viewer;
;                                               links to other pages in the library work)
;   pcx tga ico tif tiff iff lbm ilbm          (more pictures)
;   xb xbin bin                                (XBin and BIN text-mode art, shown as pictures)
;   ans ansi asc txt msg diz nfo bbs md log    (text and ANSI/ASCII art)
;   cfg ini conf 1st
;   zip rar cbz cbr                            (extracted on demand; needs subdirs=true;
;                                               a .cbz/.cbr is a comic book: a zip/rar of page images)
;
; A ZIP, RAR, CBZ or CBR file is extracted the first time a user selects it, into a directory
; of the same name beside it, and the user is taken into that directory.  After
; that, a ZIP or RAR is hidden and its directory is listed instead (as ansiview does); a CBZ or CBR
; stays listed and its directory is hidden.  The sixelview user must be able to write
; to the library directory for this to work.  Old RARs libarchive can't read are extracted
; with the unrar program if it is installed.

; One library is active so that a fresh install shows something right away: the
; sample files in the demo directory.  Replace it with your own libraries.

[library:SixelView Demo]
dir = demo
desc = Sample PDF, pictures and Sixel files
