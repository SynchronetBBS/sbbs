; Universal Viewer installer data for install-xtrn.js

Name: Universal Viewer Library
Desc: Browse and view PDFs, pictures, books, web pages, ANSI art and text files, and play music
By:   nelgin
Cats: Main
Subs: Files, Viewers, JavaScript
Inst: 2026/11/23

[copy:settings-example.ini]
