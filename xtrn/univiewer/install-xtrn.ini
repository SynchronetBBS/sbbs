; Universal Viewer installer data for install-xtrn.js

Name: Universal Viewer Library
Desc: Browse and view PDFs, pictures, books, web pages, ANSI art and text files, and play music
By:   nelgin
Cats: Main
Subs: Files, Viewers, JavaScript
Inst: 2026/11/23

[copy:settings-example.ini]
dest = settings.ini

[prog:UVLIB]
name = Universal Viewer Library
cmd  = ?univiewerlibrary.js
settings = XTRN_MULTIUSER
required = true
note = Define the libraries (directories) users can browse in settings.ini: none are defined until you do (see readme.txt)

; Optional: make it the file viewer for these types in file areas
[viewer:PDF,PNG,JPG,JPEG,GIF,BMP,SVG,SIX,PPM,PGM,PCX,TGA,ICO,TIF,TIFF,IFF,LBM,ILBM,XB,XBIN]
cmd    = ?../xtrn/univiewer/univiewer.js %f
prompt = Use Universal Viewer to view PDF and picture files in file areas

; Optional: a timed event that rebuilds the file name search index every night
; (see SEARCHING THE LIBRARIES in readme.txt).  It only reads the folders that
; have changed, so it is quick once the first run is done.  time is minutes
; after midnight (240 is 4:00 am) and days 127 is every day.
[event:UVINDEX]
name = Universal Viewer search index
cmd  = ?univiewer_index.js -q
days = 127
time = 240
prompt = Add a timed event to rebuild the Universal Viewer file name search index every night at 4:00 am
