; settings-example.ini - Universal Viewer Library configuration
;
; Copy this file to settings.ini in the univiewer directory and edit it.
; Lines starting with ; are comments.
;
; To use a different file for a menu entry, name it on the command line:
;   ?univiewerlibrary.js music.ini
; (relative to the univiewer directory, or a full path).  Music files
; (mp3, ogg, oga, opus, flac, wav, aif, aiff, aifc, au) in a library are
; played in SyncTERM.
;
; To send big songs as a smaller Opus copy (made with ffmpeg, kept in
; .cache), give the bit rate in kbps.  ffmpeg is optional but highly
; recommended, as it saves bandwidth; without it (or without this
; setting) songs are sent as they are.  Songs already at or below the
; rate are never converted.  It can also be put in a [library:...]
; section, where it overrides this one (0 there turns it off for that
; library).
;music_kbps = 128

; Full path of ffmpeg for music_kbps.  If it is not given, ffmpeg is
; looked for in the Synchronet exec directory and then on the path
; (which, for a BBS run as a service, may be shorter than yours).
;ffmpeg = /usr/bin/ffmpeg

; Full paths of unzip and unrar.  Optional.  If a path is given, that
; program extracts ZIP (or RAR) files; if it is not given, or the
; program fails on a file, Synchronet's own Archive support does it.
; Everything works without them.  (Old "imploded" ZIPs, which
; Synchronet can't read, are unpacked by the viewer's own JavaScript;
; only some old RARs really need unrar.)  Nothing is looked for on the
; path.
;unzip = /usr/bin/unzip
;unrar = /usr/bin/unrar

; Searching.  Users can search the file names and descriptions of a
; library once the sysop has built its index, which univiewer_index.js
; does when it is run from jsexec (see the readme).  Run it again when
; the files change, for example once a night.  The index is plain text
; files in the .index directory.  Without one a library has no search
; key.  noindex = true here (before the first [library:...] section)
; turns indexing off for everything in this file: the indexer then
; indexes nothing, and removes the index files it made, whenever it is
; run.  Default false.
;noindex = false
;
; The indexer reads only the folders that changed since its last run.
; Run it with -full to read every folder again, which only matters for
; files edited in place (see the readme).
;
; Theme file holding the colors and text (relative to the univiewer
; directory, or an absolute path).
theme=DefaultTheme.cfg

; Other settings.  Users can change speed and pause while browsing text
; and ANSI files, with the S (speed) and P (pause) keys.
;
;   pause         true = pause after each screen of a text or ANSI file
;                 (default false).  ANSI art then stops after every
;                 screen with a -- More -- prompt.
;   speed         output speed: 300 600 1200 2400 4800 9600 19200 38400
;                 57600 76800 115200; omit for full speed.  The BBS
;                 paces it (not SyncTERM), so that Ctrl-C, Esc or Q can
;                 always stop the display.
;   zip_max_mb, zip_max_files
;                 the largest archive that will be extracted (size when
;                 unpacked, and number of files).  Defaults 500 and
;                 2000.  For archives and disk images that are browsed
;                 in place, zip_max_mb is the largest single file that
;                 will be opened from them (zip_max_files doesn't
;                 apply).
;   error_mail    who gets a netmail when an archive can't be opened
;                 because it is over those limits: a user's alias or
;                 number, or an Internet address.  Blank = the sysop;
;                 none = nobody.
;   image_max_mb  the largest PNG rendering (online archives) that will
;                 be shown.  Default 3.
;   cache_max_days, cache_max_mb
;                 downloaded files from online archives (.cache/) are
;                 deleted when older than this many days (default 14)
;                 or, oldest first, when the cache grows beyond this
;                 many MB (default 100).  0 = no limit.
;   search_max    the most files a search lists (see Searching, above).
;                 Default 500; the most it can be is 10000.  The title of
;                 the results says how many there were in all.
;   text_types    extra file extensions to show as plain text, e.g.
;                 text_types=conf,sh,readme.  (A file with an unknown
;                 extension is shown as text anyway, unless it looks
;                 like a binary file.)
;pause=false
;speed=2400
;zip_max_mb=500
;zip_max_files=2000
;error_mail=
;text_types=
;search_max=500
;image_max_mb=3
;cache_max_days=14
;cache_max_mb=100

; Each [library:<name>] section defines one directory of files.
; Libraries are listed in the order they appear in this file.
;
;   dir       Directory holding the files (absolute, or relative to the
;             univiewer directory).  Required.
;   desc      Description shown beside the library name.
;   ars       Synchronet ARS string; only users who satisfy it can see
;             and enter the library.  Blank or missing = everyone.
;   include   Comma-separated wildcard patterns (* and ?, not case
;             sensitive).  ONLY files matching one of them are listed.
;             Blank = every supported type.
;   exclude   Comma-separated wildcard patterns.  Matching files are
;             hidden; every other supported type is listed.  If both
;             are given, include is applied first and exclude is then
;             removed from that.  (hide= is accepted as another name
;             for exclude=, for people coming from ansiview.)
;             Examples:  *.exe,*.com,*.html,*.rip,*.jpg,*.gif,*.___
;             A bare extension (pdf or .pdf) is treated as *.pdf.
;             A pattern ending in / matches directories only (the
;             others match files only), e.g. exclude = old/,*.exe  or
;             include = books/.  Directory patterns only matter when
;             subdirs = true.
;             File names are raw bytes, so DOS-era names with
;             line-drawing characters can be matched by typing the
;             characters (UTF-8, e.g. *.───) or as \xHH (*.\xC4\xC4\xC4).
;   subdirs   true = also list sub-directories so users can browse into
;             them (they can never leave the library directory).
;             Default false.
;   sort      name, date or size; prefix with - to reverse.  Default
;             name.
;   noindex   true = leave this library out of the search index, so it has
;             no search key and the indexer skips it (and removes any
;             index it made for it before).  Default false.
;
;   module    Instead of dir, the name of a hook in the hooks directory
;             that supplies the listing from an online archive (e.g.
;             sixteencolors.js).  ars, include, exclude and desc work as
;             usual; subdirs and sort do not apply.
;   url       A web site, instead of dir or module: the page shown when
;             the library is opened (a "mini browser", see the readme).
;   allow     With url: comma-separated host names (wildcards allowed)
;             that pages, pictures and links may come from.  Default:
;             the host of url.  Links to any other host are not
;             clickable, and pictures from other hosts aren't loaded.
;   images    With url: false = don't load pictures.  Default true.
;   content   With url: the ids of the page elements to show (comma
;             separated), leaving out menus, side bars and the like.
;             If none of them is on a page, the whole page is shown.
;             For Wikipedia use
;             content=searchform,firstHeading,mw-content-text
;             (searchform is the search box at the top, and needs
;             forms=true).
;   forms     With url: true = forms on the pages (search boxes and so
;             on) can be filled in and sent, with GET or POST, to hosts
;             in allow only.  Default false.
;   max_page_kb, max_image_kb
;             With url: the largest page (default 1024) and picture
;             (default 3072) that will be downloaded.
;   cachettl  With module: seconds to keep downloaded listings (default
;             86400).  With url: seconds to keep a downloaded page
;             (default 600).  Downloaded files are kept in
;             .cache/<module>/ in the univiewer directory.
;
;   Descriptions: a hidden file named .desc in a library directory
;             holds one "name<Tab>description" line per file or
;             sub-directory.  The list shows them beside the names;
;             Left/Right arrows scroll long names and descriptions
;             sideways while the size and date stay put.  See the
;             readme.
;
; Hooks are JavaScript files in the hooks directory;
; hooks/sixteencolors.js documents the (small) interface for writing
; your own.
;
; Files with any other extension (or none, e.g. recipe.012) are shown as
; plain text, so use exclude= to hide the ones you don't want listed.
; The known types are:
;
;   pdf png jpg jpeg gif bmp ppm pgm six svg
;                 shown in the Sixel viewer
;   html htm xhtml epub
;                 laid out as pages and shown in the viewer; links to
;                 other pages in the library work
;   pcx tga ico tif tiff iff lbm ilbm
;                 more pictures
;   xb xbin bin   XBin and BIN text-mode art, shown as pictures
;   ans ansi asc txt msg diz nfo bbs md log cfg ini conf 1st
;                 text and ANSI/ASCII art
;   json xml xsd xsl xslt rss atom plist
;                 text, laid out and colored
;   yaml yml toml markdown
;                 text, colored or rendered; V shows the raw file
;   zip rar       extracted on demand (needs subdirs=true)
;   7z tar tgz tbz tbz2 txz tlz tzst cpio lzh lha cab iso
;                 browsed in place (needs subdirs=true)
;   img ima dsk vfd
;                 FAT disk images, browsed in place (needs
;                 subdirs=true)
;   gz bz2 xz lzma zst
;                 one compressed file, opened in place
;   cbz cbr       a comic book: a zip or rar of page images
;
; A ZIP, RAR, CBZ or CBR file is extracted the first time a user selects
; it, into a directory of the same name beside it, and the user is taken
; into that directory.  After that, a ZIP or RAR is hidden and its
; directory is listed instead (as ansiview does); a CBZ or CBR stays
; listed and its directory is hidden.  The user the BBS runs as must be
; able to write to the library directory for this to work.
; Synchronet's own Archive support does the extracting unless the unzip
; and unrar settings above name a program to use.
;
; The other archives (7z, tar, cpio, lzh, cab, iso) and the FAT disk
; images are browsed in place: nothing is written to the library
; directory, and only a file the user opens is extracted (into
; .cache/arc/).  include and exclude apply to what is inside them too,
; so exclude = *.exe,*.dll,*.efi,*.img hides what can't be viewed.

; One library is active so that a fresh install shows something right
; away: the sample files in the demo directory.  Replace it with your own
; libraries.

[library:Universal Viewer Demo]
dir = demo
desc = Sample PDF, pictures and Sixel files
