Name: Thirstyville
Desc: Inspired by the classic door game "Lemonade"
By:   echicken -at- bbs.electronicchicken.com
Cats: Games
Subs: Trade, JavaScript
Inst: 2020/09/07

[prog:THIRSTY]
cmd  = ?thirsty.js
settings = XTRN_MULTIUSER
required = true

; Seed a sysop-owned (git-ignored) game.local.ini from the distributed
; game.ini; the door prefers it via file_cfgname().  Without this [copy:],
; [ini:game.local.ini] would fall back to writing ctrl/game.local.ini.
[copy:game.ini]
dest = game.local.ini

[ini:game.local.ini]
prompt = Share data with electronic chicken bbs
keys = server
values = 'bbs.electronicchicken.com'

!include install-json-service.ini

[ini:json-service.ini:thirsty]
keys = dir
values = startup_dir
