; SyncRetro -- what console this install IS.
;
; SHIPPED WITH THE DOOR, and read by BOTH halves of it: the lobby (lobby.js, via
; exec/load/syncretro_lobby.js) and the native door binary. That is the whole
; reason it is a file rather than either one's code -- these four facts used to
; travel from the lobby to the door on the COMMAND LINE, which Synchronet
; assembles into a 260-byte buffer on Windows and truncates there without a
; word, silently cutting the ROM argument off the end of a long cartridge name.
;
; NOT syncretro.ini: that one is the SYSOP's (audio, video, idle, roms, text),
; is not shipped, and must never be overwritten by an upgrade. This one is ours
; and will be. Nothing here is a per-install setting -- an install does not get
; to redefine which console it is.

[console]
; What the player is shown.
name    = Arcade
; Where a column is tight, and -- lower-cased, alphanumerics only -- the "id"
; that names the per-user save directory and the ROM cache: "arcade".
short   = Arcade
; The libretro core, WITHOUT extension (.so / .dll / .dylib is added per
; platform). When absent, the door falls back to the single "*_libretro.<ext>"
; in this directory.
core    = mame2003_plus_libretro
; Which controller the door's key bindings imitate: pad, intv or arcade.
; A cabinet IS a gamepad electrically; what differs is the bind table's labels
; and the absent Tab controller-swap, which on a cabinet would silently move a
; player's input to a second player's controls.
profile = arcade
