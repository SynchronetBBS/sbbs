; SyncRetro -- Arcade (MAME 2003-Plus).  SHIPPED WITH THE DOOR.
;
; EDIT syncretro.local.ini, NOT THIS FILE. This one is ours and an upgrade will
; replace it. Yours sits beside it, is read second, and wins key by key -- so it
; holds only what you changed, and every default and new setting added upstream
; keeps arriving underneath it.
;
; Read by BOTH halves of the door: the lobby (lobby.js, via
; exec/load/syncretro_lobby.js) and the native binary. That is the whole reason
; it is a file rather than either one's code -- these facts used to travel from
; the lobby to the door on the COMMAND LINE, which Synchronet assembles into a
; 260-byte buffer on Windows and truncates there without a word, silently
; cutting the ROM argument off the end of a long cartridge name.
;
; Display names for individual romsets live in games.ini, beside this file,
; with your own in games.local.ini.
;
; THIS FILE IS AUTHORITATIVE. The door and the lobby both carry compiled
; defaults for every setting, but those exist only so a damaged install still
; starts -- what a working install uses is what is written here, and what you
; write over it.

[console]
; WHAT THIS CONSOLE IS. `name`, `short`, `core` and `profile` are facts about
; what we shipped: overriding them in syncretro.local.ini is possible and is
; almost certainly a mistake -- `short` in particular derives the id that names
; the shared save directory (see shared_saves below), so changing it orphans
; the machine's high-score table. Keys added here later may be claims about
; what the core can do rather than facts about the package, and those ARE
; yours to correct; each says so.

; What the player is shown.
name    = Arcade

; Where a column is tight, and -- lower-cased, alphanumerics only -- the "id"
; that names the shared save directory and the ROM cache: "arcade".
;
; `short` derives the id ("arcade") that names the shared save dir and the ROM
; cache. It must STAY "Arcade": change it and the machine's high-score table --
; everyone's, not just one player's -- is orphaned under
; data/syncretro/arcade/shared.
short   = Arcade

; The libretro core, WITHOUT extension (.so / .dll / .dylib is added per
; platform). When absent, the door falls back to the single "*_libretro.<ext>"
; in this directory.
; no extension: .so / .dll / .dylib
core    = mame2003_plus_libretro

; Which controller the door's key bindings imitate: pad, intv or arcade.
;
; An arcade control panel is a stick, a coin slot and a row of buttons, which
; IS a plain RetroPad -- so the `arcade` profile BINDS exactly what `pad`
; binds, and exists for the words rather than the wiring. A player told that
; Backspace is "Select" does not know it is the coin slot, and on a cabinet
; nothing happens at all until a coin goes in. It also drops the Tab
; controller-swap, which here only moves the player onto player two's
; controls and leaves him with a dead machine.
;
; Insert a coin, then press start.
profile = arcade

; Where the core's saves go. Default: PER-USER, which is right for a cartridge
; console -- one player's battery save is not another's. `shared_saves = true`
; points every player at one directory instead, which is right for an ARCADE
; cabinet: the high-score table is the whole point of the machine, and there is
; no per-player save to keep apart.
;
; THE HIGH-SCORE TABLE IS THE MACHINE'S, NOT THE PLAYER'S.
;
; Every player shares one save directory, so the score you set is the score
; the next caller has to beat -- which is the whole point of an arcade
; cabinet, and the reason this console does not want the per-user sandbox a
; cartridge console does. MAME 2003-Plus writes its hiscore files (and its
; input cfg) under the save directory the frontend hands it, so this is all
; it takes.
;
; KNOWN LIMITATION, worth stating out loud: two nodes playing the SAME game
; at the same time each hold that game's scores in memory and write them at
; exit, so the second one out wins and the first one's scores are lost. It
; is a lost update, not a corrupt file, and it needs a busy BBS and one
; popular game to happen at all. Fixing it properly means arbitrating the
; score file across nodes, which is a feature, not a bug-fix.
shared_saves = true

; NO BIOS. A few romsets need a parent set present (mspacman.zip resolves
; puckman.zip in a split set), but that is another romset in roms/, not a
; BIOS image the sysop has to find -- so there is nothing for the picker to
; reject.
bios    =

; How the door gets the player's connection. Default: a SOCKET (Synchronet
; hands the door one end of a loopback socketpair and pumps it). `stdio = true`
; instead has Synchronet fork the door on a raw pty (EX_STDIO|EX_BIN) and relay
; it -- the same shape Mystic uses on *nix, and so the way to exercise the
; door's -stdio path against a real session.
;stdio = false

[roms]
; Directory holding romsets, relative to this file. Default: roms
dir = roms

; A romset is a .zip, and -- unlike every other console -- its FILENAME IS
; DATA. MAME identifies the game by the zip's basename ("puckman.zip" -> the
; puckman driver), so a romset must NOT be renamed to something more readable.
; That is why the picker gets its display names from games.ini rather than
; from the filename the way a cartridge console does.
;
; MAME also opens the .zip itself (block_extract = true), so nothing here or
; in the lobby should try to look inside one.
;
; Extensions to consider, comma-separated. Default: zip -- and there is no
; reason to change it: MAME reads romsets as .zip archives.
ext = zip

; Measured across a 272-romset collection: 1.8 KB (a tiny clone that shares
; its parent's data) to 15 MB, median 50 KB. The band is deliberately loose
; at both ends -- unlike a cartridge console, where the size range IS a
; meaningful filter, a romset's size says nothing about whether it is a
; game. The core is the only real judge, and it rejects cleanly.
min_size = 1024
max_size = 67108864

; Case-insensitive substrings; any filename containing one is hidden. This is
; the useful knob for an arcade install, because a MAME romset collection is
; mostly things you do NOT want in a BBS picker:
;
;   - CLONES and BOOTLEGS. Every game has several ("puckmana", "puckmanf",
;     "pacmanbl", ...). The parent is the one to show.
;   - TEMPEST wants a spinner -- a continuously-rotating dial with no discrete
;     positions -- and this door has no input path for one; a keyboard cannot
;     fake "a little" versus "a lot" of rotation. That is a controls problem,
;     not a size one: a measured VECTOR game is not automatically too big.
;     Battlezone (see [options] below) is one, and plays fine over a terminal
;     at its own native resolution on two digital joysticks -- no spinner or
;     second stick needed beyond the keys this console's bindings already
;     give it.
;
; There is no clever filter for the first one: MAME's parent/clone
; relationship is not visible in the filename. Hide what you do not want by
; name.
;
; exclude = tempest
exclude =

[video]
; The SHAPE the picture is drawn at; see xtrn/syncnes/syncretro.ini for the
; full explanation of why a "correct" number can look wrong (it depends on
; the player's SyncTERM screen mode, which the door cannot see).
;
; UNSET ON PURPOSE HERE, unlike the NES install. An upright arcade game is
; already TALL -- Pac-Man is 224x288 -- and the pre-compensation that helps a
; landscape console is the wrong direction for a portrait picture. MAME also
; reports a usable aspect of its own per game, and it varies (a vertical cabinet
; and a horizontal one are not the same shape), so there is no single number to
; put here the way there is for one fixed console.
;
; Start with the core's own answer. If everything looks too narrow in SyncTERM's
; VGA modes, try 1.2; on a square-pixel client, leave it alone.
; aspect = core

; dirty_rect -- repaint only the parts of the picture that CHANGED, instead of
; re-sending the whole frame every time. The terminal is already holding the
; last frame and a sixel can be drawn at any character cell, so on a mostly
; static screen (a maze, a scoreboard, a play field with a few sprites) this
; sends the movement rather than the picture.
;
; Applies only where it is safe to omit the colour palette -- SyncTERM, which
; persists sixel colour registers between images. Every other terminal, and any
; frame where the palette changed, the image moved or resized, or a door screen
; painted over the game, falls back to a whole frame automatically.
;
; The Ctrl-S stats row shows "dr N%" -- the share of frames that were patched
; rather than repainted -- and the door logs a one-line summary on exit. Set
; false if you ever see stale or garbled patches; whole frames are always
; correct, and that is what the door did before this existed.
; dirty_rect = true

[audio]
; The player can change the volume in-game with '+' and '-' (10% a step), and
; the door SHOWS the new level on the bottom row. At 0 it sends no audio at all
; -- no encode, no upload, no queue.
;
; MAME 2003-Plus mixes at 48 kHz and the door takes the rate from the core, so
; there is nothing to set here. (Worth knowing WHY that works: the core derives
; its rate from a core option, and reports 0 Hz -- and plays silence -- to any
; frontend that does not answer its option queries. The door answers them.)
; enabled   = true
; quality   = 0.15
; volume    = 100
; chunk_ms  = 100
; prebuffer = 3

[options]
; libretro core options, passed to MAME 2003-Plus as `key = value`. Anything not
; listed keeps the core's own advertised default -- which the door hands back
; properly, and which matters more than it sounds: told NOTHING at all, this core
; reports a 0 Hz sample rate and plays no audio whatsoever.
;
; THEY LIVE HERE RATHER THAN ON THE DOOR'S COMMAND LINE because the BBS builds
; that command line in a 260-character buffer and truncates it without a word.
; The line is already ~240 characters for one game, and adding options to it cut
; the ROM argument off the end. The ini has no such limit.
;
; The two below skip MAME's copyright and warning screens. They are not
; cosmetic: a player who dialled in to play Pac-Man cannot meaningfully dismiss
; a legal notice, and without these he waits through both before the game.
mame2003-plus_skip_disclaimer = enabled
mame2003-plus_skip_warnings   = enabled
;
; VECTOR games (Battlezone), measured with probe_core. The core advertises
; these two ONLY for a vector driver, so a raster game ignores them outright --
; the door logs a WARNING that it did, which is the noise these two lines cost.
;
;   - vector_resolution: the core's own default is 1024x768, a SUPERSAMPLED
;     surface meant for a CRT, not the game's size. Battlezone's native
;     resolution is 400x300 = 120k pixels a frame, UNDER the 200k/frame the
;     raster library already runs at; "original" selects it. At Battlezone's
;     own 40fps rather than 60, that is a pixel RATE of roughly 1.2x Pac-Man's,
;     not the twelve-times figure the two raw resolutions alone would suggest.
;   - vector_antialias: the sole cause of the colour blowup. Antialiased beams
;     measure 489 distinct colours in a frame, so the sixel quantizer loses
;     colour; off, it is 64-79 and quantization is EXACT. Translucency is NOT
;     the culprit (off by itself: still 475) and is deliberately left enabled.
mame2003-plus_vector_resolution = original
mame2003-plus_vector_antialias  = disabled
;
; Worth trying, not pinned: constrain an 8-way input to 4 directions for games
; built around a 4-way stick (Pac-Man, Dig Dug). Whether it feels better on a
; KEYBOARD is a judgement to make at a real terminal.
;mame2003-plus_four_way_emulation = enabled
;
; The door logs "core options: N advertised, N pinned, N read" at startup, and
; WARNS about any key here that this core does not advertise -- so a typo shows
; up in the door's diagnostics rather than silently doing nothing. Those go to
; the Synchronet log on *nix (prefixed "syncretro:") and to
; data/syncretro/syncretro_n<node>.log on Windows; see README.md.

[idle]
; End the game when a player stops providing input, handing them back to the
; BBS. This does NOT drop the call -- the BBS's own inactivity timer takes over
; once they are back at a normal prompt.
;
; That BBS timer (SCFG's "Maximum Inactivity") cannot do this for a graphical
; door: it is reset by any socket traffic, and this door's frame pacing makes
; the terminal answer ~10x/second on its own, so it never fires here however it
; is configured.
;
; Read by BOTH the door and the lobby. A bare number is SECONDS; "15m" and
; "1h" also work. LEAVING THIS UNSET IS NOT THE SAME AS OFF: unset means the
; built-in default of 10 minutes. Set it to 0 to disable idle detection
; entirely.
;timeout    = 10m
; Countdown shown before exiting. Any key clears it and resets the clock.
;warn       = 60s
; Users matching this ARS are never timed out (evaluated by the lobby, which
; is the only side that can see the user record). Default matches the BBS's
; own convention: an H-exempt user is exempt from inactivity everywhere else.
;exempt_ars = EXEMPT H

[lobby]
; enter_sound -- play a one-shot sound once when a player enters the lobby, on a
; SyncTERM that can decode audio files (silent on any other terminal). A path to
; a WAV/OGG/FLAC/VOC file you supply (relative to this door's dir, or absolute)
; -- or a wildcard (e.g. sounds/*.wav) from which one match is chosen at random.
; Prefer OGG or WAV. Blank/unset = no entry sound.
;
; NOTHING ships here (don't redistribute copyrighted sound). An arcade game's
; sound is GENERATED by its sound hardware as the game runs, so it is nowhere in
; the romset as data and no tool can pull it out. Supply your own file.
;enter_sound = sounds/*.wav

; ---------------------------------------------------------------------------
; header / footer -- optional display files drawn above and below the game
; list, on every page. The door-side equivalent of the xtrn_head / xtrn_tail
; menu files Synchronet's own external-programs menu takes.
;
; THERE IS NOTHING TO CONFIGURE FOR THE ORDINARY CASE: drop a file named
; lobby_header.ans (or .msg) in this directory and it is drawn. The extension is
; chosen by what the caller's terminal can display, in the order Synchronet
; picks a menu file's variants: .rip, .mon (ANSI without color), .ans, .seq
; (Commodore), then .msg. That last pair REVERSES to .asc-then-.msg for a
; terminal that asked for plain ASCII, since a .msg may carry CP437
; box-drawing characters such a caller cannot show. Ship as many as you like
; and each caller gets the one they can see; all but .rip may carry Ctrl-A
; attribute codes.
;
; A header REPLACES the built-in "SyncRetro -- <console>" title line. The
; live "Top played" row is separate: it is data rather than decoration,
; and it is turned off on its own with a blank top_played in [text] below.
;
; The keys are only needed to point somewhere else, or to turn an installed file
; off:
;   header = welcome              another file here (extension chosen as above)
;   header = /path/to/art.ans     an absolute path, used exactly as given
;   header =                      blank: ignore lobby_header.* even if present
;
; Keep the art to plain sequential lines and end it with a newline. The lobby
; sizes the page around the file's height, and art that positions the cursor
; absolutely -- or a line that wraps past the screen width -- occupies more rows
; than it appears to. Every row the header and footer take is one row fewer for
; games, so on an 80x24 screen a tall header is felt immediately.
;header =
;footer =

; cell_width -- the visible width of one game cell, which is what decides
; how many columns fit the caller's screen. Raise it for a wider cell_fmt
; (below); the title is fitted to whatever the format's number and separator
; leave.
;cell_width = 38

[text]
; Every string the lobby displays. An unset key uses the built-in text shown
; beside it, so this entire section is optional -- it is here for a sysop who
; wants to re-word, re-color or translate the picker.
;
; One lobby serves every console, so the built-in wording says "cartridge"
; even here, where a game is a romset in a cabinet. Re-wording those messages
; is what this section is for.
;
; WRITE THESE KEYS WITH A COLON, NOT AN EQUALS SIGN:
;
;   title : \1h\1cSyncRetro \1n\1c-- %s\1n
;
; The colon tells Synchronet's ini parser that the value is a string literal and
; that escapes in it are to be processed:
;
;   \1h \1c \1n     Ctrl-A attribute codes -- the same spelling ctrl/text.dat
;                   uses (\1h bright, \1c cyan, \1r red, \1n back to normal;
;                   exec/load/cga_defs.js lists them all)
;   \xb3            a raw CP437 byte -- here the vertical bar drawn between a
;                   game's number and its title
;   \r\n            carriage return, line feed
;
; A colon also PRESERVES A TRAILING SPACE, which several of these strings need.
; An equals sign trims it and takes backslashes literally. Wrap a value in
; "quotes" if you want to see for yourself where it ends.
;
; A BLANK value means "draw nothing here", including any line break the built-in
; text carries. That is how the "Top played" row is turned off:
;
;   top_played :
;
; DON'T put a "; comment" after one of these keys. A string value has no
; delimiter, so the parser cannot tell your note from the text -- it becomes
; part of the string. Comment on the line above instead.
;
; The %-arguments are FIXED per key and are listed below. They are printf-style,
; so keep their order and their types; a string that ignores its arguments is
; fine, one that asks for an argument that was never passed prints rubbish.

; The header block: the title line (unless a header display file replaced it),
; then the live "Top played" row, which is built from the label plus one entry
; per game until the row is full.
;title : \1h\1cSyncRetro \1n\1c-- %s\1n
;top_played : "\1hTop played:\1n "
;top_played_fmt : "\1c%s \1h(%d)\1n  "

; One cell of the game grid: %u is the number the caller types to play it,
; %s the title. THE NUMBER COMES FIRST AND THE TITLE SECOND -- printf fills them in
; the order they are passed, not by name -- and the title must be present, or
; the grid would be a column of numbers. The title is padded and clipped to fill
; cell_width, whatever the rest of the format spends.
;cell_fmt : \1h\1c%3u \xb3 \1n\1c%s\1n

; The bottom row: %d is the current page, then the page count. It ends WITHOUT a
; line break on purpose -- the cursor rests on the bottom row, which is never
; scrolled, so the terminal never interrupts with a pause prompt. Keep it inside
; one screen row for the same reason.
;prompt : "\1h\1c#\1n play   \1h\1cF\1nind   \1h\1cN\1next \1h\1cP\1nrev   \1h\1cQ\1nuit   \1cPage \1h%d\1n\1c of \1h%d\1n: "
;search : "\r\nSearch: "
;no_match : "\r\n\1hNothing matches. \1n"

; The first run in a directory has to read and hash every file, which is slow
; enough on a big set to look like a hung door -- hence the notice. %d is the
; number found.
;scanning : "\r\n\1hScanning cartridges (first run, this takes a moment)...\1n"
;scanned : " \1h\1c%d\1n\1h found.\1n\r\n"

; Things that went wrong. %s is the ROM directory; for bios_missing, the console
; name, then this directory, then the missing file(s).
;no_roms : "\r\n\1h\1rNo cartridges found in %s/.\1n\r\n"
;bios_missing : "\r\n\1h\1rThe %s BIOS is missing from %s: %s\r\nWithout it no cartridge will run. Ask the sysop.\1n\r\n"
;unsafe_name : "\r\n\1h\1rThat cartridge's filename contains a quote, backslash, backtick or dollar sign, which the door's command line cannot carry. Ask the sysop to rename it.\1n\r\n"
;rom_gone : "\r\n\1h\1rThat cartridge is gone. Rescanning.\1n\r\n"
