; games.ini -- what MAME 2003-Plus never tells the frontend.
; Keyed by ROMSET NAME (the zip's basename). Everything but `name` is optional.
;
; *** EDIT games.local.ini, NOT THIS FILE. ***
;
; This file ships with Synchronet and is replaced wholesale by an upgrade, so
; anything written here is lost the next time the door is updated. Beside it,
; games.local.ini is yours: it is read over the top of this one, key by key, and
; is never tracked or overwritten. Copy in only the lines you want to change --
;
;     [pacman]
;     name = Pac-Man (the good one)
;
; -- and everything you did not mention keeps coming from this file, so the
; titles and measurements added upstream still reach your install. A romset with
; a section only in games.local.ini works exactly as one written here.
;
; MAME identifies a game BY the zip basename, so a romset can never be renamed
; to something readable -- the readable name lives here instead. A romset with
; no section is listed under its raw name, which is ugly but harmless.
;
; button.<id> names what a RetroPad button IS on this cabinet (<id> is one of
; B A Y X L R). The core sends no input descriptors, so this cannot be derived
; -- it is measured, with probe_core -hold. Label ALL of a cabinet's live
; buttons or none: the help screen hides the ones a labelled section omits.
; stick2 marks a twin-stick cabinet and labels its second stick.
;
; boot_frames runs a cabinet's power-on self-test at full speed -- the RAM/ROM
; check and licence screen nobody can act on, since a coin-op ignores input
; until a credit is in -- so play starts at the attract loop instead of a test
; pattern. Written HERE, before any section, it applies to every romset; a
; section may override it. The emulation is not altered, only the waiting: 900
; frames is 15 seconds of cabinet time for about a third of a second of CPU.
; Set it to 0 to watch every cabinet boot in real time.

boot_frames = 900

