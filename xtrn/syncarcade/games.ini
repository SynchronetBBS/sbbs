; The handlebars are a pair of pots on the cabinet's ADC, and they do not rest
; in the middle of it: MAME's centre is a hard left turn at full speed, which
; the bike takes with nobody at the keyboard. Below about 36% it walks into the
; oncoming lane and above about 50% it walks the other way; 45% is where a
; released handlebar feels right in between. The speed axis is set to the pace
; the game itself rides at during a level's scripted entry. Nudge either in
; games.local.ini if the bike leans on your ROM set.
[paperboy]
name        = Paperboy
analog_rest = 45,57

