Name: ZZT
Desc: Synchronet TypeScript port of classic ZZT
By:   hm.derdoc, at futureland dot today
Cats: Games
Subs: Adventure, ANSI, JavaScript
Inst: 2026/04/08

[prog:ZZT]
cmd  = ?zzt.js
settings = XTRN_MULTIUSER
execution_ars = ANSI AND COLS 80
required = true

; Seed a sysop-owned (git-ignored) zzt.ini from the distributed template; the
; game reads zzt.ini from this directory.  Without this [copy:], the [ini:]
; target would not exist in the startup_dir and install-xtrn.js would fall
; back to writing ctrl/zzt.ini, which the game never reads.
[copy:zzt.example.ini]
dest = zzt.ini

[ini:zzt.ini]
prompt = Use Futureland.today for InterBBS High Score Server?
keys = server
values = 'futureland.today'
done = true
