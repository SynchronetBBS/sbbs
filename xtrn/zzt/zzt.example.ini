; ZZT configuration template.
;
; The installer copies this file to zzt.ini beside it and writes the sysop's
; answers there; zzt.ini is git-ignored, so your edits are never replaced by a
; Synchronet upgrade and never show up as a dirty working tree.  If you are
; installing by hand, copy this file to zzt.ini yourself.
;
; The game reads zzt.ini (or ZZT.INI) from this directory only.  Keys live at
; the root of the file -- there are no sections.  Every key below is optional
; and is shown with its default.

; InterBBS high-score server to publish scores to.  Also accepted as
; HIGH_SCORE_BBS or BBS_NAME.  Unset means scores stay local.
;SERVER = futureland.today

; Path to the shared high-score JSON.  Point several BBSes at one path to sync
; scores between them.
;HIGH_SCORE_JSON = /sbbs/xtrn/zzt/data/highscores.json

; Root directory for per-player saved games.
;SAVE_ROOT = /sbbs/xtrn/zzt/data/saves

; ANSI music emission for ZZT sound patterns (OOP #PLAY and sound effects).
;   AUTO (default) - emit for terminal sessions; web/bridge sessions are
;                    suppressed via the bridge handshake
;   ON             - always emit, including bridge sessions
;   OFF            - never emit
;ANSI_MUSIC = AUTO

; ANSI music introducer sequence: PIPE (CSI |, default), N, or M.
;ANSI_MUSIC_INTRODUCER = PIPE

; ON emits foreground music (may block until notes finish); OFF (default)
; emits background music so gameplay is not held up.
;ANSI_MUSIC_FOREGROUND = OFF
