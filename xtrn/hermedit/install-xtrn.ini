Name: HERMedIT
Desc: Hybrid ANSI art and word-processing message editor
By:   hm.derdoc, at futureland dot today
Cats: Editors
Subs: Editor, ANSI, JavaScript
Inst: 2026/08/01

; An editor has no start-up directory (there is no such field in xedit_t), so
; the command line carries the path itself.  The ctrl directory is the CWD of
; the sbbs process, and js_execfile() uses a command containing a path
; separator verbatim, so this resolves for any tree where ctrl and xtrn share
; a parent -- which is every default install.
;
; Keep the .js: the extension is only implied for a bare module name.  Once
; the command contains a separator, js_execfile() appends nothing and looks
; up the path exactly as written.
[editor:HERMEDIT]
name = HERMedIT
cmd = ?../xtrn/hermedit/HERMedIT.js %f
ars = ANSI AND COLS 80

; QUICKBBS   - MSGINF/MSGTMP editor information files; MSGINF declares the
;              session charset, which is what makes UTF-8 sessions work
; BIN        - no charset/LF translation: the editor emits CP437 art verbatim
; QUOTENONE  - start replies with a clean body; the original stays in
;              QUOTES.TXT and is inserted deliberately via the quote picker
; QUOTEWRAP  - word-wrap quoted text to the terminal width
; SAVECOLUMNS- record the terminal width used to compose the message
; UTF8       - the editor handles UTF-8 sessions
settings = XTRN_QUICKBBS|XTRN_BIN|XTRN_QUOTENONE|XTRN_QUOTEWRAP|XTRN_SAVECOLUMNS|XTRN_UTF8

; No drop file: the editor takes the message path on its command line (%f).
type = XTRN_NONE

; Retain soft CRs (0x8d): that byte is a valid CP437 art glyph here, so
; expanding or stripping it would corrupt drawings.
soft_cr = 3

; Wrap quoted text to the terminal width rather than a fixed column.
quotewrap_cols = 0
