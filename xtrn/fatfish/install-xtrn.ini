Name: Fat Fish
Desc: Fishing simulation door game
By:   art, at fatcatsbbs dot com
Cats: Games
Subs: Sport, Simulation, Multiplayer, JavaScript
Inst: 2020/09/16

[prog:FATFISH]
cmd  = ?fatfish.js
settings = XTRN_MULTIUSER
execution_ars = ANSI
required = true

; Seed a sysop-owned (git-ignored) server.local.ini from the distributed
; server.ini; the door prefers it via file_cfgname().  Without this [copy:],
; [ini:server.local.ini] would fall back to writing ctrl/server.local.ini.
[copy:server.ini]
dest = server.local.ini

[ini:server.local.ini]
prompt = Share data with romulusbbs.com
keys = host
values = 'romulusbbs.com'

!include install-json-service.ini

[ini:json-service.ini:fatfish]
keys=dir
values=startup_dir