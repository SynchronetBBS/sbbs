    - .\build.bat
  artifacts:
    name: syncrpg-win32
    paths:
      - "src/doors/syncrpg/build-msvc/Release/syncrpg.exe"

# This door's build.bat replaces the tracked POSIX symlink at
# scummvm\backends\platform\termgfx with a junction to door\ (Windows checks the
# symlink out as a plain text file, and create_project needs a real directory),
# then marks the path skip-worktree so the runner's checkout does not report it.
# `build.bat clean` is what undoes both.
"windows-x86 [syncscumm]":
  extends: .windows-door
  script:
    - cd src/doors/syncscumm
    - .\build.bat
  artifacts:
    name: syncscumm-win32
    paths:
      - "src/doors/syncscumm/build-msvc/Release/syncscumm.exe"

# The Clans is the one door with an MSVC solution instead of a build.bat, so it
# goes through the umbrella script, which already carries the MSBuild probe and
# the Release/Win32 arguments.  Builds the game and its fifteen devkit tools.
"windows-x86 [clans]":
  extends: .windows-door
  script:
    - cd src/doors
    - .\build.bat clans
  artifacts:
    name: clans-win32
    paths:
      - "src/doors/clans-src/bin/*.Win32.Release.exe"

"freebsd-amd64 [sbbs-noskeeters]":
  extends:
    - .freebsd-build
    - "freebsd-amd64 [sbbs-build]"
  variables:
    BUILDPFLAGS: "RELEASE=1 WITHOUT_MOSQUITTO=1"
    EXTRA_FILENAME: "-noskeeters"
