variables:
  BUILD_ARGS:
    description: "Extra arguments to pass on gmake command lines."

stages:
  - build
  - test
  - cleanup

.rules:
  rules:
    - changes:
      - src/**/*
      - 3rdp/**/*
      - ctrl/text.dat
      - xtrn/**/{GNUm,M}akefile
      - xtrn/**/*.{c,h,cpp,hpp,mk}
      - exec/tests/**/*
      - "**/*.mk"
      # The CI definition itself, so a commit that only edits CI config still
      # runs one.  Without this a pipeline change cannot test itself: it stays
      # unvalidated until someone happens to touch src/ or 3rdp/.
      - .gitlab-ci*.yml

include:
  - local: '.gitlab-ci-unix.yml'
    inputs:
      os: 'openbsd'
      platform: 'amd64'
      tagname: 'OpenBSD'
      build_flags: 'CC="ccache cc" CXX="ccache c++" RELEASE=1 NO_ABSOLUTE_RPATH=1'
      has_graphics: 'no'
      slow_system: 'yes'
  - local: '.gitlab-ci-unix.yml'
    inputs:
      os: 'netbsd'
      platform: 'amd64'
      tagname: 'NetBSD'
      build_flags: 'CC="ccache cc" CXX="ccache c++" RELEASE=1 USE_SYSTEM_CURSES=1 NO_ABSOLUTE_RPATH=1'
      has_graphics: 'no'
  - local: '.gitlab-ci-unix.yml'
    inputs:
      os: 'freebsd'
      platform: 'amd64'
      tagname: 'FreeBSD'
      build_flags: 'CC="ccache cc" CXX="ccache c++" RELEASE=1 NO_ABSOLUTE_RPATH=1'
      has_valgrind: "yes"
      build_doors: "yes"
  - local: '.gitlab-ci-unix.yml'
    inputs:
      os: 'raspberrypi'
      platform: 'arm64'
      tagname: 'RaspberryPi'
      build_flags: 'CC="ccache cc" CXX="ccache c++" RELEASE=1 NO_ABSOLUTE_RPATH=1'
      has_gtk: "yes"
      has_valgrind: "yes"
      build_doors: "yes"
      valgrind_pre_exec: "setarch -L"
  - local: '.gitlab-ci-unix.yml'
    inputs:
      os: "linux"
      platform: "x64"
      tagname: "Linux"
      has_gtk: "yes"
      build_flags: 'CC="ccache cc" CXX="ccache c++" RELEASE=1 NO_ABSOLUTE_RPATH=1'
      has_valgrind: "yes"
      build_doors: "yes"
      build_termgfx_doors: "yes"
      build_more_doors: "yes"
      build_qtmonitor: "yes"
  - local: '.gitlab-ci-unix.yml'
    inputs:
      os: "alpine-linux"
      platform: "x64"
      tagname: "alpine-linux"
      build_flags: 'CC="ccache cc" CXX="ccache c++" RELEASE=1 NO_ABSOLUTE_RPATH=1'
      has_javascript: 'no'
      build_doors: "yes"
