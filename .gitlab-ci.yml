    - .\build.bat
  artifacts:
    name: syncduke-win32
    paths:
      - "src/doors/syncduke/build-msvc/Release/syncduke.exe"

"windows-x86 [syncmoo1]":
  extends: .windows-door
  script:
    - cd src/doors/syncmoo1
    - .\build.bat
  artifacts:
    name: syncmoo1-win32
    paths:
      - "src/doors/syncmoo1/build-msvc/Release/syncmoo1.exe"

"windows-x86 [syncretro]":
  extends: .windows-door
  script:
    - cd src/doors/syncretro
    - .\build.bat
  artifacts:
    name: syncretro-win32
    paths:
