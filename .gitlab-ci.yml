"linux-x64 jsexec-smoketest":
  tags: [Linux]
  image: gcc
  stage: test
  extends: .rules
  script:
    - cd src/sbbs3
    - export LD_LIBRARY_PATH=$(realpath *.lib.release)
    - "*.exe.release/jsexec -C -c../../ctrl -r 'exit(0)'"
  needs: ["linux-x64 [sbbs]"]

"linux-x64 install":
  tags: [Linux]
  image: gcc
  stage: test
  extends: .rules
  script:
    - mkdir sbbs
    - cd sbbs
    - make -f ../install/install-sbbs.mk NOCAP=1 REPODIR=$(realpath ..) CC="ccache cc" CXX="ccache c++"
  needs: []

# Windows uses the platform-limited vcpkg manifest in the qtmonitor source
# directory.  Unix and macOS jobs live in .gitlab-ci-unix.yml so unsupported
# runners can omit them with the build_qtmonitor input.
.qtmonitor-vcpkg:
  stage: build
  needs: []
  variables:
    QTMONITOR_VCPKG_REF: "2026.06.01"
  cache:
    key: "qtmonitor-vcpkg-$CI_JOB_NAME_SLUG"
    paths:
      - .cache/vcpkg/
  rules:
    - changes:
      - src/sbbs3/qtmonitor/**/*
      - .gitlab-ci*.yml

"windows [qtmonitor]":
  extends: .qtmonitor-vcpkg
  tags: [Windows]
  script:
    - $env:VCPKG_ROOT = Join-Path $env:CI_PROJECT_DIR ".vcpkg"
    - $env:VCPKG_DOWNLOADS = Join-Path $env:CI_PROJECT_DIR ".cache\vcpkg\downloads"
    - $env:VCPKG_DEFAULT_BINARY_CACHE = Join-Path $env:CI_PROJECT_DIR ".cache\vcpkg\binaries"
    - New-Item -ItemType Directory -Force $env:VCPKG_DOWNLOADS, $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
    - git clone --depth 1 --branch $env:QTMONITOR_VCPKG_REF https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
    - '& (Join-Path $env:VCPKG_ROOT "bootstrap-vcpkg.bat") -disableMetrics'
    - cd src/sbbs3/qtmonitor
    - cmake --preset windows-vcpkg
    - cmake --build --preset windows-vcpkg
    - ctest --preset windows-vcpkg

"windows-x86 [sbbs]":
  tags: [Windows]
  stage: build
  extends: .rules
  script:
    - cd src/xpdev
    - make
    - cd ../../src/sbbs3
    - .\release.bat
    - cd ctrl
    - .\build.bat
    - cd ../chat
    - .\build.bat
    - cd ../useredit
    - .\build.bat
    - cd ../../../xtrn/sbj
    - make
    - cd ../tbd
    - make
  dependencies: []
  artifacts:
    name: sbbs-win32
    paths:
      - "src/sbbs3/*.exe.Release/*.exe"
      - "src/sbbs3/*.dll.Release/*.dll"
      - "src/sbbs3/*/*.exe.Release/*.exe"
      - "src/sbbs3/*/*.exe"
      - "xtrn/*/*.exe"

"windows-x86 jsexec-smoketest":
  tags: [Windows]
  stage: test
  extends: .rules
  script:
    - cd src/sbbs3/msvc.win32.dll.release
    - $env:PATH = $env:CI_PROJECT_DIR + "\3rdp\win32.release\cryptlib\bin;" + $env:PATH
    - ..\msvc.win32.exe.release\jsexec -c../../../ctrl -C exit(0)"
  needs: ["windows-x86 [sbbs]"]

"windows-x86 jsexec-testsuite":
  tags: [Windows]
  stage: test
  extends: .rules
  script:
    - cd src/sbbs3/msvc.win32.dll.release
    - $env:PATH = $env:CI_PROJECT_DIR + "\3rdp\win32.release\cryptlib\bin;" + $env:PATH
    - ..\msvc.win32.exe.release\jsexec -c../../../ctrl -C ../../../exec/tests/test.js
  needs: ["windows-x86 [sbbs]"]

"windows-x86 [sexpots]":
  tags: [Windows]
  stage: build
  extends: .rules
  script:
    - cd src/sexpots
    - .\release.bat
  artifacts:
    name: sexpots-win32
    paths:
      - "src/sexpots/Release/*.exe"

"windows-x86 [svdm]":
  tags: [Windows]
  stage: build
  extends: .rules
  script:
    - cd src/vdmodem
    - .\release.bat
  artifacts:
    name: svdm-win32
    paths:
      - "src/vdmodem/Release/*.exe"

"windows-x86 [syncterm-msvc]":
  tags: [Windows]
  stage: build
  extends: .rules
  script:
    - cd src/syncterm
    - .\release.bat
  artifacts:
    name: syncterm-msvc
    paths:
      - "src/syncterm/msvc.build/Release/*.exe"

################
# Win32 doors  #
################
# The doors with an MSVC build, one job each -- the same set src\doors\build.bat
# calls buildable on Windows.  Every remaining door under src\doors is a make(1)
# + libODoors tree with no MSVC project; those are covered by the *nix jobs.
#
# Seven of the eight are driven through the door's OWN build.bat, which is the
# documented entry point and encodes that door's CMake flags (e.g. syncconquer's
# second Tiberian Dawn binary).  Driving CMake directly here would silently drop
# them.  Each is a self-contained CMake project that builds its dependencies
# (xpdev, termgfx, the vendored engine) as sub-targets, so these need nothing
# from the library jobs -- hence `needs: []`, letting them start immediately.
# Building never touches an install: deploying is a separate `jsexec deploy.js`.
#
# VS 2022 is the only hard requirement -- each build.bat falls back to the cmake
# bundled with VS when none is on PATH.  libjxl and libsndfile (vcpkg, triplet
# x86-windows-static-md) are OPTIONAL and detected at configure time: without
# them a door still builds but degrades to the sixel + raw-PCM tiers, so their
# absence on the runner is a silent change in the artifact, not a red job.
#
# Win32 only, deliberately: a Win32 door runs on a Win32 and a Win64 Synchronet
# host alike, and three of these doors refuse x64 outright.
".windows-door":
  tags: [Windows]
  stage: build
  extends: .rules
  needs: []

"windows-x86 [syncconquer]":
  extends: .windows-door
  script:
    - cd src/doors/syncconquer
    - .\build.bat
  artifacts:
    name: syncconquer-win32
    paths:
      - "src/doors/syncconquer/build-msvc/Release/syncalert.exe"
      - "src/doors/syncconquer/build-msvc/Release/syncdawn.exe"

"windows-x86 [syncdoom]":
  extends: .windows-door
  script:
    - cd src/doors/syncdoom
    - .\build.bat
  artifacts:
    name: syncdoom-win32
    paths:
      - "src/doors/syncdoom/build-msvc/Release/syncdoom.exe"

